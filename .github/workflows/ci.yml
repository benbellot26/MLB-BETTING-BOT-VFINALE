name: Pulsar Legacy Reference Data CI

on:
  push:
    branches: [main]
    paths:
      - 'v11/**'
      - 'tests/test_v137*.py'
      - 'tests/test_v138*.py'
      - 'tests/test_v139*.py'
      - 'tests/test_v1310*.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/v13-7-free-data-collector.yml'
  pull_request:
    paths:
      - 'v11/**'
      - 'tests/test_v137*.py'
      - 'tests/test_v138*.py'
      - 'tests/test_v139*.py'
      - 'tests/test_v1310*.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/v13-7-free-data-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsar-legacy-reference-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-reference-data-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile frozen reference-data code
        run: python -m py_compile v11/*.py
      - name: Reference-data safety preflight
        run: python -m v11.v13_preflight --verbose
