name: Pulsar Legacy Reference Data CI

on:
  push:
    branches: [main]
    paths:
      - 'v11/**'
      - 'tests/test_v137*.py'
      - 'tests/test_v138*.py'
      - 'tests/test_v139*.py'
      - 'tests/test_v1310*.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/v13-7-free-data-collector.yml'
  pull_request:
    paths:
      - 'v11/**'
      - 'tests/test_v137*.py'
      - 'tests/test_v138*.py'
      - 'tests/test_v139*.py'
      - 'tests/test_v1310*.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/v13-7-free-data-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsar-legacy-reference-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-reference-data-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile frozen reference-data code
        run: python -m py_compile v11/*.py
      - name: Reference-data safety preflight
        run: python -m v11.v13_preflight --verbose
