name: MLB Betting Bot V12.3.1 CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: v12-3-1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile v11/*.py tests/test_v11.py tests/test_historical_bootstrap.py tests/test_v123.py tests/test_v1231_runlines.py tests/test_safe_singles_v1231.py

      - name: V12.2 regression tests
        run: python -m unittest tests.test_v11 tests.test_historical_bootstrap

      - name: V12.3 methodology tests
        run: python -m unittest tests.test_v123

      - name: V12.3.1 alternate runline tests
        run: python -m unittest tests.test_v1231_runlines

      - name: V12.3.1 safe 1.60 singles tests
        run: python -m unittest tests.test_safe_singles_v1231

      - name: V12.3 baseline-safe bootstrap validation
        run: python -m v11.v123_bootstrap --dry-run >/tmp/v12_3_bootstrap.json

      - name: V12.3.1 engine self-test
        run: python -m v11.v123_entry --self-test

      - name: V12.3.1 Champion Challenger dry-run
        run: python -m v11.v123_train --dry-run >/tmp/v12_3_candidate.json

      - name: V12.3.1 point-in-time evaluation smoke test
        run: python -m v11.v123_backtest >/tmp/v12_3_backtest.json
