name: MLB Betting Bot V12.3.2 + V12.4 Shadow CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'hotfix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: v12-3-2-v12-4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile v11/*.py tests/test_v11.py tests/test_historical_bootstrap.py tests/test_v123.py tests/test_v1231_runlines.py tests/test_safe_singles_v1231.py tests/test_shadow_v115.py tests/test_calibration_v1232.py tests/test_predictive_v124.py tests/test_v124_statcast_provider.py tests/test_v124_weather.py tests/test_v124_weight_optimizer.py tests/test_v124_research_monitor.py tests/test_v124_historical_reconstruction.py tests/test_v124_historical_warmstart.py tests/test_discord_limits.py

      - name: V12.2 regression tests
        run: python -m unittest tests.test_v11 tests.test_historical_bootstrap

      - name: V12.3 methodology tests
        run: python -m unittest tests.test_v123

      - name: V12.3.2 alternate runline regression tests
        run: python -m unittest tests.test_v1231_runlines

      - name: V12.3.2 value-selection tests
        run: python -m unittest tests.test_safe_singles_v1231

      - name: V11.5 shadow challenger tests
        run: python -m unittest tests.test_shadow_v115

      - name: V12.3.2 calibration challenger tests
        run: python -m unittest tests.test_calibration_v1232

      - name: V12.4 predictive core shadow tests
        run: python -m unittest tests.test_predictive_v124

      - name: V12.4 Statcast provider tests
        run: python -m unittest tests.test_v124_statcast_provider

      - name: V12.4 complete weather tests
        run: python -m unittest tests.test_v124_weather

      - name: V12.4 weight optimizer tests
        run: python -m unittest tests.test_v124_weight_optimizer

      - name: V12.4 research monitor tests
        run: python -m unittest tests.test_v124_research_monitor

      - name: V12.4 historical reconstruction tests
        run: python -m unittest tests.test_v124_historical_reconstruction tests.test_v124_historical_warmstart

      - name: Historical source cohort smoke test
        run: |
          python -m v11.v124_historical_reconstruction --offline-dry-run > /tmp/v124_hist_source.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/v124_hist_source.json'))
          assert p['source_games'] >= 1700, p
          print(p)
          PY

      - name: Discord embed limit tests
        run: python -m unittest tests.test_discord_limits

      - name: V12.4 optimizer persisted-journal smoke test
        run: |
          python - <<'PY'
          from v11.v123_runtime import activate
          activate()
          from v11 import journal
          from v11.v124_research_monitor import canonical_rows
          from v11.v124_weight_optimizer import build_model, current_model
          rows = journal.load_rows()
          native = build_model(rows)
          composed = current_model()
          assert composed['affects_v12_selection'] is False
          assert composed['research_only'] is True
          assert native['settled_games'] == len(canonical_rows(rows))
          assert composed.get('native_settled_games', composed['settled_games']) == native['settled_games']
          assert all(0.0 <= float(w) <= 1.25 for w in composed['weights'].values())
          print('native=', native['settled_games'], 'source=', composed.get('weight_source'), 'weights=', composed['weights'])
          PY

      - name: V12.3 baseline-safe bootstrap validation
        run: python -m v11.v123_bootstrap --dry-run >/tmp/v12_3_bootstrap.json

      - name: V12.3.2 engine self-test
        run: python -m v11.v123_entry --self-test

      - name: V12.3.2 Champion Challenger dry-run
        run: python -m v11.v123_train --dry-run >/tmp/v12_3_candidate.json

      - name: V12.3.2 point-in-time evaluation smoke test
        run: python -m v11.v123_backtest >/tmp/v12_3_backtest.json
