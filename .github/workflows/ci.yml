name: Pulsar Regression CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'hotfix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: pulsar-regression-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile v11/*.py v14/*.py tests/*.py
      - name: V12 regression suite
        run: |
          python -m unittest tests.test_v11 tests.test_historical_bootstrap
          python -m unittest tests.test_v123
          python -m unittest tests.test_v1231_runlines
          python -m unittest tests.test_safe_singles_v1231
          python -m unittest tests.test_v1233_audit_hardening
          python -m unittest tests.test_shadow_v115
          python -m unittest tests.test_calibration_v1232
          python -m unittest tests.test_predictive_v124 tests.test_v124_statcast_provider
          python -m unittest tests.test_v124_weather tests.test_v124_starter_ip_v2
          python -m unittest tests.test_v124_weight_optimizer tests.test_v124_research_monitor
          python -m unittest tests.test_v124_historical_reconstruction tests.test_v124_historical_daily_reconstruction tests.test_v124_historical_warmstart
          python -m unittest tests.test_discord_limits
      - name: Shared V13.5.2 critical preflight
        run: |
          python -m v11.v13_preflight --verbose
          python -m unittest tests.test_v13_rich_run_residual tests.test_v13_rich_native_train tests.test_v13_discord_visual
          python -m v11.v13_entry --self-test
          python -m v11.v13_train --dry-run >/tmp/v13_calibration_candidate.json
          python -m v11.v13_posterior_policy >/tmp/v13_posterior_policy.json
          python -m v11.v13_rich_native_train >/tmp/v13_rich_native_candidate.json
      - name: Historical source cohort smoke test
        run: python -m v11.v124_source_cohort >/tmp/v124_source_cohort.json
      - name: V12.4 optimizer persisted-journal smoke test
        run: python -m v11.v124_weight_optimizer --journal data/v11_3_live.jsonl --save data/v124_active_weights.json >/tmp/v124_optimizer_report.json
      - name: V12.3 baseline-safe bootstrap validation
        run: python -m v11.v123_baseline_validation --journal data/v11_3_live.jsonl --bootstrap-samples 200 --no-discord
      - name: V12.3 Champion Challenger dry-run
        run: python -m v11.v123_champion_challenger --dry-run --bootstrap-samples 200 --no-discord
      - name: V12.3 point-in-time evaluation smoke test
        run: python -m v11.v123_point_in_time_eval --journal data/v11_3_live.jsonl --bootstrap-samples 200 --no-discord
