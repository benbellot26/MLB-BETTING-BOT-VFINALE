name: MLB Betting Bot V12.3.2 + V12.4 Shadow CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: v12-3-2-v12-4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile v11/*.py tests/test_v11.py tests/test_historical_bootstrap.py tests/test_v123.py tests/test_v1231_runlines.py tests/test_safe_singles_v1231.py tests/test_shadow_v115.py tests/test_calibration_v1232.py tests/test_predictive_v124.py tests/test_v124_statcast_provider.py tests/test_v124_weather.py

      - name: V12.2 regression tests
        run: python -m unittest tests.test_v11 tests.test_historical_bootstrap

      - name: V12.3 methodology tests
        run: python -m unittest tests.test_v123

      - name: V12.3.2 alternate runline regression tests
        run: python -m unittest tests.test_v1231_runlines

      - name: V12.3.2 value-selection tests
        run: python -m unittest tests.test_safe_singles_v1231

      - name: V11.5 shadow challenger tests
        run: python -m unittest tests.test_shadow_v115

      - name: V12.3.2 calibration challenger tests
        run: python -m unittest tests.test_calibration_v1232

      - name: V12.4 predictive core shadow tests
        run: python -m unittest tests.test_predictive_v124

      - name: V12.4 Statcast provider tests
        run: python -m unittest tests.test_v124_statcast_provider

      - name: V12.4 complete weather tests
        run: python -m unittest tests.test_v124_weather

      - name: V12.3 baseline-safe bootstrap validation
        run: python -m v11.v123_bootstrap --dry-run >/tmp/v12_3_bootstrap.json

      - name: V12.3.2 engine self-test
        run: python -m v11.v123_entry --self-test

      - name: V12.3.2 Champion Challenger dry-run
        run: python -m v11.v123_train --dry-run >/tmp/v12_3_candidate.json

      - name: V12.3.2 point-in-time evaluation smoke test
        run: python -m v11.v123_backtest >/tmp/v12_3_backtest.json
