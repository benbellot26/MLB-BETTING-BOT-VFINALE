name: MLB Betting Bot V13 Professional Probability + Shadows CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'hotfix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: v13-professional-probability-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile
        run: python -m py_compile v11/*.py tests/*.py

      - name: V12 regression suite
        run: |
          python -m unittest tests.test_v11 tests.test_historical_bootstrap
          python -m unittest tests.test_v123
          python -m unittest tests.test_v1231_runlines
          python -m unittest tests.test_safe_singles_v1231
          python -m unittest tests.test_v1233_audit_hardening
          python -m unittest tests.test_shadow_v115
          python -m unittest tests.test_calibration_v1232
          python -m unittest tests.test_predictive_v124 tests.test_v124_statcast_provider
          python -m unittest tests.test_v124_weather tests.test_v124_starter_ip_v2
          python -m unittest tests.test_v124_weight_optimizer tests.test_v124_research_monitor
          python -m unittest tests.test_v124_historical_reconstruction tests.test_v124_historical_daily_reconstruction tests.test_v124_historical_warmstart
          python -m unittest tests.test_discord_limits

      - name: V13 probability contract tests
        run: |
          python -m unittest tests.test_v13_probability_contract
          python -m unittest tests.test_v13_historical_migration
          python -m unittest tests.test_v13_probability_invariants
          python -m v11.v13_entry --self-test
          python -m v11.v13_train --dry-run >/tmp/v13_calibration_candidate.json

      - name: Historical source cohort smoke test
        run: |
          python -m v11.v124_historical_reconstruction --offline-dry-run > /tmp/v124_hist_source.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/v124_hist_source.json'))
          assert p['source_games'] >= 1700, p
          print(p)
          PY

      - name: V12.4 optimizer persisted-journal smoke test
        run: |
          python - <<'PY'
          from v11.v123_runtime import activate
          activate()
          from v11 import journal
          from v11.v124_research_monitor import canonical_rows
          from v11.v124_weight_optimizer import build_model, current_model
          from v11 import predictive_v124 as v124
          rows = journal.load_rows()
          native = build_model(rows)
          composed = current_model()
          assert composed['affects_v12_selection'] is False
          assert composed['research_only'] is True
          assert native['settled_games'] == len(canonical_rows(rows))
          assert composed.get('native_settled_games', composed['settled_games']) == native['settled_games']
          assert all(0.0 <= float(w) <= 1.25 for w in composed['weights'].values())
          assert getattr(v124, '_starter_ip_v2_installed', False) is True
          assert (native.get('walk_forward') or {}).get('boundary') in {None, 'calendar_day'}
          print('native=', native['settled_games'], 'source=', composed.get('weight_source'), 'weights=', composed['weights'])
          PY

      - name: V12.3 baseline-safe bootstrap validation
        run: python -m v11.v123_bootstrap --dry-run >/tmp/v12_3_bootstrap.json

      - name: V12.3 Champion Challenger dry-run
        run: python -m v11.v123_train --dry-run >/tmp/v12_3_candidate.json

      - name: V12.3 point-in-time evaluation smoke test
        run: python -m v11.v123_backtest >/tmp/v12_3_backtest.json
