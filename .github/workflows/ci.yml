name: Pulsar Legacy Data Regression CI

on:
  push:
    branches: [main]
    paths:
      - 'v11/**'
      - 'tests/test_v12*.py'
      - 'tests/test_v123*.py'
      - 'tests/test_v124*.py'
      - 'tests/test_v13*.py'
      - 'tests/test_shadow_v115.py'
      - 'tests/test_calibration_v1232.py'
      - 'tests/test_historical_bootstrap.py'
      - 'tests/test_safe_singles_v1231.py'
      - 'tests/test_discord_limits.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/v13-7-free-data-collector.yml'
      - '.github/workflows/v13-8-audit-closure.yml'
  pull_request:
    paths:
      - 'v11/**'
      - 'tests/test_v12*.py'
      - 'tests/test_v123*.py'
      - 'tests/test_v124*.py'
      - 'tests/test_v13*.py'
      - 'tests/test_shadow_v115.py'
      - 'tests/test_calibration_v1232.py'
      - 'tests/test_historical_bootstrap.py'
      - 'tests/test_safe_singles_v1231.py'
      - 'tests/test_discord_limits.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/v13-7-free-data-collector.yml'
      - '.github/workflows/v13-8-audit-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsar-legacy-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-legacy-data-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frozen legacy/data-foundation code
        run: python -m py_compile v11/*.py
      - name: Legacy regression suite
        run: |
          python -m unittest tests.test_historical_bootstrap
          python -m unittest tests.test_v123 tests.test_v1231_runlines tests.test_safe_singles_v1231
          python -m unittest tests.test_v1233_audit_hardening tests.test_shadow_v115 tests.test_calibration_v1232
          python -m unittest tests.test_predictive_v124 tests.test_v124_statcast_provider tests.test_v124_weather tests.test_v124_starter_ip_v2
          python -m unittest tests.test_v124_weight_optimizer tests.test_v124_research_monitor
          python -m unittest tests.test_v124_historical_reconstruction tests.test_v124_historical_daily_reconstruction tests.test_v124_historical_warmstart
          python -m unittest tests.test_discord_limits
      - name: V13 frozen data-foundation preflight
        run: python -m v11.v13_preflight --verbose
