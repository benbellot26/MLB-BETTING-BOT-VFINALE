name: MLB Betting Bot V11

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-v11
  cancel-in-progress: false

jobs:
  run-bot:
    name: Exécution du Bot V11
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Récupération du repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validation V11
        run: |
          python --version
          python -m py_compile v11/*.py tests/test_v11.py
          python -m v11.runner --self-test
          python -m unittest tests.test_v11

      - name: Exécution du Bot V11
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BANKROLL: ${{ vars.BANKROLL }}
          UNIT: ${{ vars.UNIT }}
          MIN_EV: ${{ vars.MIN_EV }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
        run: |
          mkdir -p data
          python -m v11.runner

      - name: Validation des données V11
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          journal = Path('data/v11_3_live.jsonl')
          if journal.exists():
              for line in journal.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      json.loads(line)
              print(f'{journal}: valide')

          report = Path('data/v11_3_live_report.json')
          if report.exists():
              json.loads(report.read_text(encoding='utf-8'))
              print(f'{report}: valide')
          PY

      - name: Sauvegarde du journal V11
        if: success()
        run: |
          git config user.name "MLB Betting Bot V11"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -f data/v11_3_live.jsonl ] && git add data/v11_3_live.jsonl
          [ -f data/v11_3_live_report.json ] && git add data/v11_3_live_report.json

          if git diff --cached --quiet; then
            echo "Données V11 inchangées."
            exit 0
          fi

          git commit -m "data: update V11 live journal [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
