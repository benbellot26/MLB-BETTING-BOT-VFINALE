name: MLB Betting Bot V9

on:
  workflow_dispatch:

  schedule:
    - cron: "17 16 * * *"
      timezone: "Europe/Paris"
    - cron: "17 20 * * *"
      timezone: "Europe/Paris"
    - cron: "47 23 * * *"
      timezone: "Europe/Paris"
    - cron: "17 2 * * *"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-v9
  cancel-in-progress: false

jobs:
  run-bot:
    name: Exécution du Bot V9
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Récupération du repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validation Python
        run: |
          python --version
          python -m py_compile bot.py
          python bot.py --self-test

      - name: Exécution du Bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BANKROLL: ${{ vars.BANKROLL }}
          UNIT: ${{ vars.UNIT }}
          MAX_STAKE_UNITS: ${{ vars.MAX_STAKE_UNITS }}
          MIN_EV: ${{ vars.MIN_EV }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          MAX_DAILY_EXPOSURE_PCT: "0.30"
          MAX_GAME_EXPOSURE_PCT: "0.15"
          MAX_BETS_PER_GAME: "2"
          HISTORY_FILE: data/mlb_history_v9.jsonl
          MATCH_MAX_DELTA_HOURS: "2.0"
          ARCHIVE_AFTER_DAYS: "45"
        run: |
          mkdir -p data
          python bot.py

      - name: Validation données V9
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [Path('data/mlb_history_v9.jsonl')]
          paths += sorted(Path('data/archive_v9').glob('*.jsonl')) if Path('data/archive_v9').exists() else []
          for p in paths:
              if not p.exists():
                  continue
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  if line.strip():
                      json.loads(line)
              print(f'{p}: valide')

          state = Path('data/v9_state.json')
          if state.exists():
              json.loads(state.read_text(encoding='utf-8'))
              print(f'{state}: valide')
          PY

      - name: Sauvegarde historique V9
        if: success()
        run: |
          git config user.name "MLB Betting Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/mlb_history_v9.jsonl data/v9_state.json data/archive_v9 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Données V9 inchangées."
            exit 0
          fi

          git commit -m "data: update MLB V9 history [skip ci]"
          git pull --rebase origin main
          git push
