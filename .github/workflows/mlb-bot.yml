name: MLB Betting Bot V13.10 Champion Production

on:
  schedule:
    # Cheap schedule-only gate. Paid odds/model work runs only for a new undelivered FINAL-phase game.
    - cron: '7 0-6,14-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  gate:
    name: Gate production FINAL
    runs-on: ubuntu-latest
    outputs:
      run_needed: ${{ steps.gate.outputs.run_needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve production gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'run_needed=true' >> "$GITHUB_OUTPUT"
            echo '{"reason":"manual-dispatch","run_needed":true}'
          else
            python -m v11.v13_production_gate > /tmp/v13_production_gate.json
            cat /tmp/v13_production_gate.json
            run_needed=$(python -c "import json; d=json.load(open('/tmp/v13_production_gate.json')); print('true' if d.get('run_needed') else 'false')")
            echo "run_needed=$run_needed" >> "$GITHUB_OUTPUT"
          fi

  run-bot:
    name: Exécution du champion V13.10
    needs: gate
    if: needs.gate.outputs.run_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate V13.10 champion contract
        run: |
          python -m py_compile v11/*.py tests/*.py
          python -m unittest \
            tests.test_v13_probability_contract \
            tests.test_v13_probability_invariants \
            tests.test_v13_precision_hardening \
            tests.test_v13_analytics_only \
            tests.test_v1352_runtime_hook \
            tests.test_v138_production_change_gate \
            tests.test_v139_explicit_engine \
            tests.test_v1310_deep_audit_hardening \
            tests.test_v1310_deep_audit_registry \
            tests.test_v1310_pit_weather_hotfix \
            tests.test_v1310_max_audit_hardening \
            tests.test_v1310_champion_only \
            tests.test_v1310_champion_dashboard
          python -m v11.v13_entry --self-test

      - name: Ensure baseline-safe historical reference
        run: |
          python - <<'PY'
          import json
          from v11.methodology_v123 import install
          install()
          from v11 import v123_bootstrap as hb
          model = hb.ensure_artifact()
          allowed = {'PASS', 'FAIL', 'COLLECTING', 'INCOMPATIBLE_BASELINE'}
          if model.get('status') not in allowed:
            raise SystemExit(f"Unexpected V12.3 bootstrap status: {model.get('status')}")
          meta = model.get('metadata') or {}
          if model.get('eligible_for_final_prior') and meta.get('baseline_schema') != hb.BASELINE_SCHEMA:
              raise SystemExit('Historical prior baseline schema mismatch')
          if model.get('status') == 'INCOMPATIBLE_BASELINE' and model.get('eligible_for_final_prior'):
              raise SystemExit('Legacy V10 baseline must never activate a V12.3 prior')
          if meta.get('test_used_for_activation') is not False:
              raise SystemExit('Frozen historical test must remain reporting-only')
          print(json.dumps({
              'version': model.get('version'),
              'status': model.get('status'),
              'eligible_for_final_prior': model.get('eligible_for_final_prior'),
              'source_games': meta.get('source_games'),
              'native_baseline_games': meta.get('native_baseline_games'),
              'baseline_schema': meta.get('baseline_schema'),
              'algorithm_fingerprint': meta.get('algorithm_fingerprint'),
              'test_used_for_activation': meta.get('test_used_for_activation'),
          }, indent=2, sort_keys=True))
          PY

      - name: Build V13.10 baseball calibration
        run: python -m v11.v13_train

      - name: Persist champion pre-run artifacts
        run: |
          git config user.name 'MLB Betting Bot V13.10'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v12_3_historical_bootstrap_model.json ] && git add data/v12_3_historical_bootstrap_model.json
          [ -f data/v13_baseball_calibration.json ] && git add -f data/v13_baseball_calibration.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist V13.10 champion artifacts [skip ci]'
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Run V13.10 champion without Discord
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BANKROLL: ${{ vars.BANKROLL }}
          UNIT: ${{ vars.UNIT }}
          MIN_EV: ${{ vars.MIN_EV }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          V12_DEFER_DISCORD: '1'
          V1231_ENABLE_ALT_RUNLINES: '1'
          V123_MIN_REFERENCE_PRICE: '1.40'
          V123_MIN_CONFIDENCE_RUNLINE: '0.55'
          V123_MIN_CONFIDENCE_ML: '0.58'
          V123_MIN_CONFIDENCE_TOTAL: '0.58'
          # Defense in depth: V13.10 also defaults these research shadows to OFF in code.
          V1232_ENABLE_V115_SHADOW: '0'
          V124_ENABLE_SHADOW: '0'
        run: |
          mkdir -p data runtime/v11
          python -m v11.v13_entry

      - name: Validate V13.10 probability state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v11.professional_probability_checks_v13 import check_result
          from v11.probability_contract_v13 import MODEL_GENERATION_FINGERPRINT
          from v11.point_in_time_v13 import validate_pregame_row

          for name in ('data/v11_3_live.jsonl','data/v11_bet_ledger.jsonl','data/v13_feature_store.jsonl','data/v13_label_store.jsonl'):
              p = Path(name)
              if p.exists():
                  for line in p.read_text(encoding='utf-8').splitlines():
                      if line.strip():
                          json.loads(line)

          payload = json.loads(Path('runtime/v11/discord_payload.json').read_text(encoding='utf-8'))
          report = payload.get('report') or {}
          if payload.get('chosen'):
              raise SystemExit('V13 analytics-only payload contains chosen recommendations')
          if (payload.get('combo') or {}).get('official'):
              raise SystemExit('V13 analytics-only payload contains an official combo')

          results = payload.get('results') or []
          bad = []
          for result in results:
              if result.get('model_generation') != MODEL_GENERATION_FINGERPRINT:
                  bad.append({'game_pk': result.get('game_pk'), 'reason': 'model generation mismatch'})
              check = check_result(result)
              if not check['passes']:
                  bad.append(check)
              chain = result.get('v13_shadow_chain') or {}
              rich = result.get('shadow_v13_rich_runs') or {}
              if rich.get('affects_v13_probability') is not False:
                  bad.append({'game_pk': result.get('game_pk'), 'reason': 'rich shadow affected probability'})
              if chain.get('affects_probability') is not False:
                  bad.append({'game_pk': result.get('game_pk'), 'reason': 'shadow chain affected probability'})
              for option in result.get('options') or []:
                  if option.get('posterior_allowed_for_edge') is not False:
                      bad.append({'game_pk': result.get('game_pk'), 'reason': 'posterior entered edge selection'})
                  if option.get('p_predictive_final') != option.get('p_baseball_calibrated'):
                      bad.append({'game_pk': result.get('game_pk'), 'reason': 'primary probability changed'})
                  execution = option.get('winamax_eval') or {}
                  if execution.get('official_selected') or execution.get('selected') or float(execution.get('official_units') or 0.0) != 0.0:
                      bad.append({'game_pk': result.get('game_pk'), 'reason': 'analytics-only option became actionable'})
          if bad:
              raise SystemExit(f'V13.10 probability invariant failure: {bad[:3]}')

          live = Path('data/v11_3_live.jsonl')
          if live.exists():
              rows = [json.loads(x) for x in live.read_text(encoding='utf-8').splitlines() if x.strip()]
              current = [r for r in rows if r.get('model_generation') == MODEL_GENERATION_FINGERPRINT and r.get('result_status') != 'FINAL']
              invalid = [(r.get('game_pk'), validate_pregame_row(r)[1]) for r in current if not validate_pregame_row(r)[0]]
              if invalid:
                  raise SystemExit(f'PIT provenance invalid: {invalid[:3]}')

          feature_store = Path('data/v13_feature_store.jsonl')
          if feature_store.exists():
              for line in feature_store.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  for forbidden in ('home_score','away_score','winner'):
                      if forbidden in row:
                          raise SystemExit(f'Feature-label leakage: {forbidden}')

          run_id = report.get('run_id')
          ledger = Path('data/v11_bet_ledger.jsonl')
          action_events = []
          if run_id and ledger.exists():
              for line in ledger.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  if event.get('run_id') == run_id and event.get('event_type') in {'PROPOSED','PUBLISHED','CONFIRMED_PLACED'}:
                      action_events.append({'event_type': event.get('event_type'), 'bet_key': event.get('bet_key')})
          if action_events:
              raise SystemExit(f'V13 analytics-only run wrote betting ledger events: {action_events[:3]}')
          PY

      - name: Persist V13.10 probability evidence
        run: |
          git config user.name 'MLB Betting Bot V13.10'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v11_3_live.jsonl ] && git add data/v11_3_live.jsonl
          [ -f data/v11_3_live_report.json ] && git add data/v11_3_live_report.json
          [ -f data/v11_bet_ledger.jsonl ] && git add -f data/v11_bet_ledger.jsonl
          [ -f data/v13_baseball_calibration.json ] && git add -f data/v13_baseball_calibration.json
          [ -f data/v13_probability_diagnostics.json ] && git add -f data/v13_probability_diagnostics.json
          [ -f data/v13_champion_dashboard.json ] && git add -f data/v13_champion_dashboard.json
          [ -f data/v13_champion_dashboard.md ] && git add -f data/v13_champion_dashboard.md
          [ -f data/v13_coverage_report.json ] && git add -f data/v13_coverage_report.json
          [ -f data/v13_model_health.json ] && git add -f data/v13_model_health.json
          [ -f data/v13_feature_store.jsonl ] && git add -f data/v13_feature_store.jsonl
          [ -f data/v13_label_store.jsonl ] && git add -f data/v13_label_store.jsonl
          [ -f data/v13_market_tracking.jsonl ] && git add -f data/v13_market_tracking.jsonl
          [ -f data/v13_market_tracking_report.json ] && git add -f data/v13_market_tracking_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist V13.10 probability observations [skip ci]'
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Publish Discord analytics
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          V13_DISCORD_FINAL_ONLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python -m v11.v13_entry --send-persisted

      - name: Persist Discord delivery checkpoint
        if: always()
        run: |
          git config user.name 'MLB Betting Bot V13.10'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v11_discord_delivery.json ] && git add -f data/v11_discord_delivery.json
          [ -f data/v13_discord_delivery.json ] && git add -f data/v13_discord_delivery.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist Discord delivery checkpoint [skip ci]'
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Assert analytics-only lifecycle after Discord
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('runtime/v11/discord_payload.json').read_text(encoding='utf-8'))
          run_id = (payload.get('report') or {}).get('run_id')
          bad = []
          ledger = Path('data/v11_bet_ledger.jsonl')
          if run_id and ledger.exists():
              for line in ledger.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  if event.get('run_id') == run_id and event.get('event_type') in {'PROPOSED','PUBLISHED','CONFIRMED_PLACED'}:
                      bad.append({'event_type': event.get('event_type'), 'bet_key': event.get('bet_key')})
          if bad:
              raise SystemExit(f'V13 analytics-only run wrote betting ledger events after Discord: {bad[:3]}')
          print('V13 analytics-only lifecycle OK: no betting ledger action for run', run_id)
          PY

      - name: Prepare market archive
        if: always()
        run: |
          mkdir -p runtime/v11/snapshots
          if [ -f data/v11_market_snapshots.jsonl ]; then
            gzip -9 -c data/v11_market_snapshots.jsonl > "runtime/v11/snapshots/market_${GITHUB_RUN_ID}.jsonl.gz"
          fi

      - name: Archive point-in-time sources 90 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-point-in-time-${{ github.run_id }}
          path: |
            runtime/v11/snapshots/
            runtime/v11/source_replays/
          if-no-files-found: ignore
          retention-days: 90

      - name: Durable source replay archive
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v12-data-archive >/dev/null 2>&1 || \
            gh release create v12-data-archive --title 'Durable point-in-time data archive' --notes 'Compressed source replays and market snapshots used for reproducible V13.10 evidence.'
          shopt -s nullglob
          files=(runtime/v11/snapshots/*.gz runtime/v11/source_replays/*.gz)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload v12-data-archive "${files[@]}" --clobber
          fi