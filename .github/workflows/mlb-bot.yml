name: MLB Betting Bot V9

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * *"
      timezone: "Europe/Paris"
    - cron: "17 20 * * *"
      timezone: "Europe/Paris"
    - cron: "47 23 * * *"
      timezone: "Europe/Paris"
    - cron: "17 2 * * *"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-v9
  cancel-in-progress: false

jobs:
  run-bot:
    name: Exécution du Bot V9
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Récupération du repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correctif Discord V9.0.3
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("bot.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace('VERSION="9.0.2"', 'VERSION="9.0.3"', 1)
          s = s.replace('FEATURE_VERSION="9.0.2"', 'FEATURE_VERSION="9.0.3"', 1)

          start = s.index('def should_publish(rec,s):')
          end = s.index('\ndef discord_request', start)
          replacement = '''def should_publish(rec,s):
              snaps=rec.get("snapshots",[])
              if not snaps:return True
              last=snaps[-1]
              if last.get("feature_version")!=s.get("feature_version"):return True
              if last.get("phase")!=s.get("phase"):return True
              if last.get("directional_pick")!=s.get("directional_pick"):return True
              if abs(num(last.get("direction_confidence"))-num(s.get("direction_confidence")))>=.7:return True
              if last.get("home_lineup_count",0)<8<=s.get("home_lineup_count",0) or last.get("away_lineup_count",0)<8<=s.get("away_lineup_count",0):return True
              last_h=bool((last.get("home_statcast") or {}).get("available"));new_h=bool((s.get("home_statcast") or {}).get("available"))
              last_a=bool((last.get("away_statcast") or {}).get("available"));new_a=bool((s.get("away_statcast") or {}).get("available"))
              if (not last_h and new_h) or (not last_a and new_a):return True
              a={(p["market"],p["name"],p.get("point")) for p in last.get("selected_picks",[])}
              b={(p["market"],p["name"],p.get("point")) for p in s.get("selected_picks",[])}
              return a!=b
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding="utf-8")
          print("Correctif Discord V9.0.3 injecté")
          PY

      - name: Validation Python
        run: |
          python --version
          python -m py_compile bot.py
          python bot.py --self-test

      - name: Exécution du Bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BANKROLL: ${{ vars.BANKROLL }}
          UNIT: ${{ vars.UNIT }}
          MAX_STAKE_UNITS: ${{ vars.MAX_STAKE_UNITS }}
          MIN_EV: ${{ vars.MIN_EV }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          MAX_DAILY_EXPOSURE_PCT: "0.30"
          MAX_GAME_EXPOSURE_PCT: "0.15"
          MAX_BETS_PER_GAME: "2"
          HISTORY_FILE: data/mlb_history_v9.jsonl
          MATCH_MAX_DELTA_HOURS: "2.0"
          ARCHIVE_AFTER_DAYS: "45"
        run: |
          mkdir -p data
          python bot.py

      - name: Validation données V9
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[Path('data/mlb_history_v9.jsonl')]
          paths += sorted(Path('data/archive_v9').glob('*.jsonl')) if Path('data/archive_v9').exists() else []
          for p in paths:
              if not p.exists():continue
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip():json.loads(line)
              print(f'{p}: valide')
          state=Path('data/v9_state.json')
          if state.exists():json.loads(state.read_text(encoding='utf-8'));print(f'{state}: valide')
          PY

      - name: Sauvegarde code et historique V9
        if: success()
        run: |
          git config user.name "MLB Betting Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot.py data/mlb_history_v9.jsonl data/v9_state.json data/archive_v9 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Code et données V9 inchangés."
            exit 0
          fi
          git commit -m "fix: V9.0.3 Discord refresh + update data [skip ci]"
          git pull --rebase origin main
          git push
