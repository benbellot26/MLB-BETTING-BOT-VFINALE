name: Pulsar V14 Production

on:
  schedule:
    # Frequent wake-up is cheap: the gate performs only a free MLB schedule read
    # plus local ledger checks. Odds is called only when an uncovered canonical
    # FINAL observation is objectively due.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  run-bot:
    name: Pulsar V14 manual / scheduled FINAL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Hydrate mutable state from runtime-data
        run: |
          python -m v14.state_branch hydrate --manifest research/v14_runtime_operational_paths.txt
          python -m v14.state_branch hydrate --manifest research/v14_runtime_performance_paths.txt
          python -m v14.state_branch hydrate --manifest research/v14_runtime_reference_paths.txt

      - name: Resolve manual or objective scheduled FINAL gate
        id: gate
        env:
          # Coverage mode is explicitly opted in by production. Code defaults
          # remain the one-snapshot ultra-low fail-safe outside this workflow.
          V14_MAX_PAID_PREDICTION_SNAPSHOTS_PER_SLATE: '4'
          V14_MAX_PAID_CLOSE_SNAPSHOTS_PER_SLATE: '1'
          V14_ODDS_PROVIDER_CREDITS_PER_SNAPSHOT: '3'
          V14_MAX_AUTOMATED_ODDS_CREDITS_PER_UTC_MONTH: '420'
          V14_MAX_ALL_ODDS_CREDITS_PER_UTC_MONTH: '450'
          V14_ODDS_PROVIDER_EMERGENCY_RESERVE_CREDITS: '50'
        run: |
          set -euo pipefail
          mkdir -p runtime/v14
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m py_compile \
              v14/certification_timing.py \
              v14/api_budget.py \
              v14/scheduled_prediction_gate.py
            python -m v14.scheduled_prediction_gate \
              --predictions data/v14_predictions.jsonl \
              --api-usage-ledger data/v14_api_usage.jsonl \
              --output runtime/v14/scheduled_prediction_gate.json
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate=json.loads(Path('runtime/v14/scheduled_prediction_gate.json').read_text(encoding='utf-8'))
          print('run_required=' + ('true' if gate.get('run_required') else 'false'))
          print('run_trigger=' + str(gate.get('run_trigger') or 'SCHEDULED_FINAL'))
          print('target_date=' + str(gate.get('target_date') or ''))
          print('due_game_ids=' + ','.join(str(x) for x in gate.get('due_game_ids') or []))
          PY
          else
            TARGET_DATE=$(python - <<'PY'
          from v14.acquisition import resolve_target_date
          print(resolve_target_date())
          PY
            )
            echo "run_required=true" >> "$GITHUB_OUTPUT"
            echo "run_trigger=MANUAL" >> "$GITHUB_OUTPUT"
            echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
            echo "due_game_ids=" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain scheduled no-op
        if: steps.gate.outputs.run_required != 'true'
        run: |
          echo 'PULSAR_V14_SCHEDULED_NOOP no uncovered canonical FINAL snapshot is objectively due'
          [ -f runtime/v14/scheduled_prediction_gate.json ] && cat runtime/v14/scheduled_prediction_gate.json

      - name: Validate Pulsar V14 production contract
        if: steps.gate.outputs.run_required == 'true'
        run: |
          python -m py_compile v14/*.py
          python -m v14.preflight

      - name: Resolve slate date natively
        if: steps.gate.outputs.run_required == 'true'
        run: |
          echo "PULSAR_V14_PRODUCTION_DATE=${{ steps.gate.outputs.target_date }}"
          echo "PULSAR_V14_RUN_TRIGGER=${{ steps.gate.outputs.run_trigger }}"

      - name: Build deterministic PIT venue-park shadow
        if: steps.gate.outputs.run_required == 'true'
        run: |
          TARGET_DATE="${{ steps.gate.outputs.target_date }}"
          TARGET_SEASON="${TARGET_DATE:0:4}"
          python -m v14.venue_park_builder \
            --target-season "$TARGET_SEASON" \
            --source data/v137_park_factors.json \
            --output data/v14_venue_park_factors.json

      - name: Build PIT defense catcher baserunning shadow fail-soft
        if: steps.gate.outputs.run_required == 'true'
        run: |
          set +e
          TARGET_DATE="${{ steps.gate.outputs.target_date }}"
          mkdir -p runtime/v14
          rm -f data/v14_defense_baserunning_priors.json
          python -m v14.savant_run_value_builder "$TARGET_DATE" --output runtime/v14/v14_defense_baserunning_priors.json
          BUILD_RC=$?
          if [ "$BUILD_RC" -eq 0 ]; then
            python - <<'PY'
          import json, shutil
          from pathlib import Path
          src=Path('runtime/v14/v14_defense_baserunning_priors.json')
          if not src.exists(): raise SystemExit(2)
          x=json.loads(src.read_text(encoding='utf-8'))
          complete=int(((x.get('coverage') or {}).get('complete_teams')) or 0)
          if complete < 20:
              print('PULSAR_V14_SAVANT_SHADOW_DISABLED complete_teams=',complete)
              raise SystemExit(3)
          shutil.copyfile(src,'data/v14_defense_baserunning_priors.json')
          print('PULSAR_V14_SAVANT_SHADOW_READY complete_teams=',complete)
          PY
            VALID_RC=$?
          else
            VALID_RC=$BUILD_RC
          fi
          if [ "$VALID_RC" -ne 0 ]; then
            rm -f data/v14_defense_baserunning_priors.json
            echo "PULSAR_V14_SAVANT_SHADOW_FAIL_SOFT rc=$VALID_RC; champion unaffected"
          fi
          exit 0

      - name: Refresh provider quota with zero-credit endpoint
        if: steps.gate.outputs.run_required == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          V14_MAX_PAID_PREDICTION_SNAPSHOTS_PER_SLATE: '4'
          V14_MAX_PAID_CLOSE_SNAPSHOTS_PER_SLATE: '1'
          V14_ODDS_PROVIDER_CREDITS_PER_SNAPSHOT: '3'
          V14_MAX_AUTOMATED_ODDS_CREDITS_PER_UTC_MONTH: '420'
          V14_MAX_ALL_ODDS_CREDITS_PER_UTC_MONTH: '450'
          V14_ODDS_PROVIDER_EMERGENCY_RESERVE_CREDITS: '50'
        run: |
          set -euo pipefail
          python -m v14.odds_quota_probe --state runtime/v14/odds_provider_quota.json
          python -m v14.api_budget record-provider-state \
            --ledger data/v14_api_usage.jsonl \
            --state runtime/v14/odds_provider_quota.json
          python -m v14.api_budget report \
            --ledger data/v14_api_usage.jsonl \
            --slate-date "${{ steps.gate.outputs.target_date }}" \
            --output data/v14_api_usage_report.json
          python -m v14.state_branch persist \
            --path data/v14_api_usage.jsonl \
            --path data/v14_api_usage_report.json \
            --message 'data: refresh zero-credit Odds quota guard [skip ci]'
          python -m v14.api_budget provider-guard --ledger data/v14_api_usage.jsonl

      - name: Reserve and persist every paid Odds snapshot before request
        if: steps.gate.outputs.run_required == 'true'
        env:
          V14_MAX_PAID_PREDICTION_SNAPSHOTS_PER_SLATE: '4'
          V14_MAX_PAID_CLOSE_SNAPSHOTS_PER_SLATE: '1'
          V14_ODDS_PROVIDER_CREDITS_PER_SNAPSHOT: '3'
          V14_MAX_AUTOMATED_ODDS_CREDITS_PER_UTC_MONTH: '420'
          V14_MAX_ALL_ODDS_CREDITS_PER_UTC_MONTH: '450'
          V14_ODDS_PROVIDER_EMERGENCY_RESERVE_CREDITS: '50'
        run: |
          set -euo pipefail
          TARGET_DATE="${{ steps.gate.outputs.target_date }}"
          TRIGGER="${{ steps.gate.outputs.run_trigger }}"
          if [ "$TRIGGER" = "SCHEDULED_FINAL" ]; then
            python -m v14.api_budget record-prediction \
              --ledger data/v14_api_usage.jsonl \
              --slate-date "$TARGET_DATE" \
              --due-games "${{ steps.gate.outputs.due_game_ids }}"
          else
            python -m v14.api_budget record-manual \
              --ledger data/v14_api_usage.jsonl \
              --slate-date "$TARGET_DATE"
          fi
          python -m v14.api_budget report \
            --ledger data/v14_api_usage.jsonl \
            --slate-date "$TARGET_DATE" \
            --output data/v14_api_usage_report.json
          # Persist before the paid request. Failures remain counted and cannot
          # create an unbudgeted retry loop, including MANUAL runs.
          python -m v14.state_branch persist \
            --path data/v14_api_usage.jsonl \
            --path data/v14_api_usage_report.json \
            --message 'data: reserve V14 paid Odds request [skip ci]'

      - name: Build native Pulsar V14 production payload
        if: steps.gate.outputs.run_required == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p runtime/v14
          python -m v14.production_runtime \
            --target-date "${{ steps.gate.outputs.target_date }}" \
            --run-trigger "${{ steps.gate.outputs.run_trigger }}" \
            --destination runtime/v14/discord_payload.json \
            --candidate-destination runtime/v14/native_candidate.json

      - name: Reconcile provider-reported quota after paid snapshot
        if: always() && steps.gate.outputs.run_required == 'true'
        env:
          V14_MAX_PAID_PREDICTION_SNAPSHOTS_PER_SLATE: '4'
          V14_MAX_PAID_CLOSE_SNAPSHOTS_PER_SLATE: '1'
          V14_ODDS_PROVIDER_CREDITS_PER_SNAPSHOT: '3'
          V14_MAX_AUTOMATED_ODDS_CREDITS_PER_UTC_MONTH: '420'
          V14_MAX_ALL_ODDS_CREDITS_PER_UTC_MONTH: '450'
          V14_ODDS_PROVIDER_EMERGENCY_RESERVE_CREDITS: '50'
        run: |
          set -euo pipefail
          if [ -f runtime/v14/odds_provider_quota.json ]; then
            python -m v14.api_budget record-provider-state \
              --ledger data/v14_api_usage.jsonl \
              --state runtime/v14/odds_provider_quota.json
            python -m v14.api_budget report \
              --ledger data/v14_api_usage.jsonl \
              --slate-date "${{ steps.gate.outputs.target_date }}" \
              --output data/v14_api_usage_report.json
            python -m v14.state_branch persist \
              --path data/v14_api_usage.jsonl \
              --path data/v14_api_usage_report.json \
              --message 'data: attest V14 provider-reported Odds quota [skip ci]'
            python -m v14.api_budget provider-guard --ledger data/v14_api_usage.jsonl
          else
            echo 'PULSAR_V14_PROVIDER_QUOTA_ATTESTATION_MISSING paid response did not yield a quota sidecar; local hard caps remain active'
          fi

      - name: Record zero-API slate coverage and rejection reasons
        if: steps.gate.outputs.run_required == 'true'
        run: |
          python -m v14.coverage_ledger record \
            --candidate runtime/v14/native_candidate.json \
            --ledger data/v14_coverage_ledger.jsonl
          python -m v14.coverage_ledger report \
            --ledger data/v14_coverage_ledger.jsonl \
            --output data/v14_coverage_report.json

      - name: Validate Pulsar V14 publication state
        if: steps.gate.outputs.run_required == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v14.production_runtime import validate_production_payload
          path = Path('runtime/v14/discord_payload.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          validate_production_payload(payload)
          print('PULSAR_V14_PUBLICATION_STATE_OK games=', len(payload.get('results') or []))
          print('PULSAR_V14_RUN_TRIGGER=', payload.get('run_trigger'))
          print('PULSAR_V14_AUTHORIZATION=', json.dumps(payload.get('authorization_basis'), sort_keys=True))
          print('PULSAR_V14_BETTING_CERTIFICATION=', json.dumps(payload.get('betting_certification'), sort_keys=True))
          PY

      - name: Persist PIT predictions and decision evidence on runtime-data
        if: steps.gate.outputs.run_required == 'true'
        run: |
          python -m v14.tracking snapshot \
            --payload runtime/v14/discord_payload.json \
            --predictions data/v14_predictions.jsonl
          python -m v14.market_close_ledger record \
            --payload runtime/v14/discord_payload.json \
            --ledger data/v14_market_close_ledger.jsonl
          python -m v14.paper_ledger record \
            --payload runtime/v14/discord_payload.json \
            --ledger data/v14_paper_bet_ledger.jsonl
          # Hidden scheduled evidence must never consume the operational staking
          # exposure used by a later manual/user-facing authorization run.
          if [ "${{ steps.gate.outputs.run_trigger }}" = "MANUAL" ]; then
            python -m v14.bet_ledger record \
              --payload runtime/v14/discord_payload.json \
              --ledger data/v14_bet_ledger.jsonl
          fi
          python -m v14.state_branch persist \
            --manifest research/v14_runtime_operational_paths.txt \
            --message 'data: persist V14 pregame predictions, decisions and coverage [skip ci]'

      - name: Close collection policy
        if: steps.gate.outputs.run_required == 'true'
        run: |
          echo 'PULSAR_V14_CLOSE_POLICY dedicated v14-close-capture.yml only; production/manual timing cannot create certification closes'

      - name: Publish Pulsar V14 Discord analytics
        if: steps.gate.outputs.run_required == 'true' && steps.gate.outputs.run_trigger == 'MANUAL'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m v14.production_runtime --send-persisted --destination runtime/v14/discord_payload.json

      - name: Archive native point-in-time state 90 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulsar-v14-production-${{ github.run_id }}
          path: |
            runtime/v14/discord_payload.json
            runtime/v14/native_candidate.json
            runtime/v14/scheduled_prediction_gate.json
            runtime/v14/v14_defense_baserunning_priors.json
            runtime/v14/odds_provider_quota.json
            data/v14_venue_park_factors.json
            data/v14_defense_baserunning_priors.json
            data/v14_coverage_report.json
            data/v14_api_usage_report.json
          if-no-files-found: ignore
          retention-days: 90