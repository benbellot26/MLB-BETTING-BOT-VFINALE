name: MLB Betting Bot V11

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-v11
  cancel-in-progress: false

jobs:
  run-bot:
    name: Exécution du Bot V11
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Récupération du repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validation Python V10 + V11
        run: |
          python --version
          python -m py_compile bot.py bot_v11.py v11_benchmark_report.py v11_predictive_gate.py
          python v11_predictive_gate.py --self-test
          python v11_benchmark_report.py --shadow-self-test

      - name: Backtest point-in-time du benchmark V11
        env:
          HISTORY_FILE: data/mlb_history_v10.jsonl
          JOURNAL_FILE: data/mlb_bet_journal_v1.jsonl
          V11_SHARP_BOOKS: "pinnacle,betfair_ex_eu,matchbook,betonlineag"
          V11_MAX_MARKET_AGE_MIN: "90"
          V11_CONSENSUS_ROBUST_SCALE: "0.035"
        run: |
          python v11_benchmark_report.py

      - name: Exécution du Bot V11
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BANKROLL: ${{ vars.BANKROLL }}
          UNIT: ${{ vars.UNIT }}
          MAX_STAKE_UNITS: ${{ vars.MAX_STAKE_UNITS }}
          MIN_EV: ${{ vars.MIN_EV }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          MAX_DAILY_EXPOSURE_PCT: "0.30"
          MAX_GAME_EXPOSURE_PCT: "0.15"
          MAX_BETS_PER_GAME: "2"
          MAX_COMBO_EXPOSURE_PCT: "0.05"
          MIN_PLAN_CONF: "6.2"
          MIN_COMBO_CONF: "6.5"
          HISTORY_FILE: data/mlb_history_v10.jsonl
          JOURNAL_FILE: data/mlb_bet_journal_v1.jsonl
          MATCH_MAX_DELTA_HOURS: "2.0"
          ARCHIVE_AFTER_DAYS: "45"
          RUN_MODEL_MIN_GAMES: "450"
          CAL_MIN_GAMES: "500"
          V11_SHARP_BOOKS: "pinnacle,betfair_ex_eu,matchbook,betonlineag"
          V11_EXECUTION_BOOKS: "winamax_fr"
          V11_AUX_BOOKS: "betclic_fr,unibet_fr,pmu_fr,netbet_fr"
          V11_BOOK_WEIGHT_MIN_N: "80"
          V11_MAX_MARKET_AGE_MIN: "90"
          V11_CONSENSUS_ROBUST_SCALE: "0.035"
          V11_SHADOW_MODEL_WEIGHT: "0.55"
          V11_BENCHMARK_REPORT: data/v11_benchmark_report.json
          V11_AUTO_BLEND_ENABLED: "1"
          V11_AUTO_BLEND_MIN_HOLDOUT: "40"
          V11_AUTO_BLEND_MIN_BRIER_GAIN: "0.0015"
          V11_AUTO_BLEND_MIN_GAIN_PROB: "0.85"
          V11_AUTO_BLEND_MIN_MULTIREF_PCT: "0.60"
        run: |
          mkdir -p data
          python v11_predictive_gate.py

      - name: V11.1 shadow features baseball
        if: success()
        env:
          HISTORY_FILE: data/mlb_history_v10.jsonl
          V11_BASEBALL_SHADOW_FILE: data/v11_baseball_shadow.jsonl
          V11_BASEBALL_SHADOW_REPORT: data/v11_baseball_shadow_report.json
          V11_BASEBALL_MIN_FINAL: "80"
          V11_BASEBALL_MIN_HOLDOUT: "30"
          V11_BASEBALL_MIN_BRIER_GAIN: "0.0015"
          V11_BASEBALL_MIN_GAIN_PROB: "0.85"
          V11_BASEBALL_MIN_FULL_COVERAGE: "0.55"
          V11_BASEBALL_W_BULLPEN: "0.16"
          V11_BASEBALL_W_STARTER: "0.14"
          V11_BASEBALL_W_LINEUP: "0.12"
          V11_BASEBALL_W_MATCHUP: "0.10"
          V11_SHADOW_HTTP_TIMEOUT: "10"
        run: |
          python v11_benchmark_report.py --baseball-shadow

      - name: Validation données V11
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths=[
              Path('data/mlb_history_v10.jsonl'),
              Path('data/mlb_bet_journal_v1.jsonl'),
              Path('data/v11_baseball_shadow.jsonl'),
          ]
          paths += sorted(Path('data/archive_v10').glob('*.jsonl')) if Path('data/archive_v10').exists() else []
          for p in paths:
              if not p.exists():
                  continue
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      json.loads(line)
              print(f'{p}: valide')

          for p in [
              Path('data/v10_state.json'),
              Path('data/v11_benchmark_report.json'),
              Path('data/v11_baseball_shadow_report.json'),
          ]:
              if p.exists():
                  json.loads(p.read_text(encoding='utf-8'))
                  print(f'{p}: valide')
          PY

      - name: Sauvegarde historique, journal et benchmark V11
        if: success()
        run: |
          git config user.name "MLB Betting Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/mlb_history_v10.jsonl ]; then
            git add data/mlb_history_v10.jsonl
          fi
          if [ -f data/mlb_bet_journal_v1.jsonl ]; then
            git add data/mlb_bet_journal_v1.jsonl
          fi
          if [ -f data/v10_state.json ]; then
            git add data/v10_state.json
          fi
          if [ -f data/v11_benchmark_report.json ]; then
            git add data/v11_benchmark_report.json
          fi
          if [ -f data/v11_baseball_shadow.jsonl ]; then
            git add data/v11_baseball_shadow.jsonl
          fi
          if [ -f data/v11_baseball_shadow_report.json ]; then
            git add data/v11_baseball_shadow_report.json
          fi
          if [ -d data/archive_v10 ]; then
            git add data/archive_v10
          fi

          if git diff --cached --quiet; then
            echo "Données V11 inchangées."
            exit 0
          fi

          git commit -m "data: update V11 history journal benchmark and baseball shadow [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
