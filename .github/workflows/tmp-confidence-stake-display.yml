name: Temporary confidence stake display hotfix

on:
  push:
    branches:
      - hotfix-confidence-stake-display-20260811

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-confidence-stake-display-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply confidence-only displayed stake
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')
          old='''def execution_status(rec,phase):\n    if not rec:return "⚠️ Pas de recommandation modèle exploitable."\n    e=rec.get("winamax_eval");minimum=rec.get("min_price")\n    if not e:\n        return f"⚠️ **Cote Winamax absente du flux** • jouer uniquement si cote ≥ **{minimum:.2f}**\\n💰 **Mise conseillée : 0u** — attendre une cote exploitable"\n    price=e["price"];cu=num(e.get("candidate_units"),0);cs=num(e.get("candidate_stake_eur"),0)\n    if price+1e-9<minimum:\n        return f"❌ **BON PICK — PRIX TROP BAS** • Winamax {price:.2f} • minimum modèle **{minimum:.2f}**\\n💰 **Mise conseillée : 0u**"\n    if phase=="EARLY":\n        if e.get("qualified") and cu>=1:\n            return f"👀 **PRIX SUFFISANT ({price:.2f})** • phase EARLY\\n💰 **Mise recommandée si pari pris maintenant : {int(cu)}u = {cs:.2f} €** • simulation FINAL avec données/cote actuelles"\n        return f"👀 **PRIX SUFFISANT ({price:.2f})** • phase EARLY\\n💰 **Mise recommandée si pari pris maintenant : 0u** • critères actuels insuffisants"\n    if e.get("selected"):\n        return f"✅ **PARI RETENU @ {price:.2f}**\\n💰 **Mise recommandée : {int(num(e.get('units'),0))}u = {e['stake_eur']:.2f} €**"\n    if e.get("qualified"):\n        return f"🟠 **PRIX JOUABLE @ {price:.2f}**, mais non retenu par les limites portefeuille\\n💰 Mise théorique Kelly **{int(cu)}u = {cs:.2f} €** • **mise portefeuille : 0u**"\n    return f"⚪ **PAS DE MISE** @ {price:.2f} • {e.get('reason','critères insuffisants')}\\n💰 **Mise conseillée : 0u**"\n'''
          new='''def displayed_stake_units(rec):\n    c=num((rec or {}).get("confidence"),0)\n    max_u=max(0,int(math.floor(MAX_STAKE_UNITS+1e-9)))\n    if c<MIN_PLAN_CONF or max_u<1:return 0\n    u=1 if c<7.0 else 2 if c<8.0 else 3\n    return min(u,max_u)\ndef execution_status(rec,phase):\n    if not rec:return "⚠️ Pas de recommandation modèle exploitable."\n    e=rec.get("winamax_eval");minimum=rec.get("min_price");du=displayed_stake_units(rec);ds=round(du*UNIT,2)\n    if not e:\n        return f"⚠️ **Cote Winamax absente du flux** • jouer uniquement si cote ≥ **{minimum:.2f}**\\n💰 **Mise conseillée : 0u** — attendre une cote exploitable"\n    price=num(e.get("price"),0)\n    if price+1e-9<minimum:\n        return f"❌ **BON PICK — PRIX TROP BAS** • Winamax {price:.2f} • minimum modèle **{minimum:.2f}**\\n💰 **Mise conseillée : 0u**"\n    if du<=0:\n        return f"⚪ **PRIX SUFFISANT ({price:.2f})**, mais confiance sous le seuil {MIN_PLAN_CONF:.1f}/10\\n💰 **Mise conseillée : 0u**"\n    phase_txt=f" • phase {phase}" if phase else ""\n    return f"✅ **PRIX SUFFISANT ({price:.2f})**{phase_txt}\\n💰 **Mise recommandée : {du}u = {ds:.2f} €** • basée sur la confiance modèle, indépendante de l’EV/Kelly"\n'''
          if old not in s:
              raise SystemExit('execution_status block not found')
          s=s.replace(old,new,1)
          s=s.replace('VERSION="10.0.2"','VERSION="10.0.3"',1)
          s=s.replace('RECOMMENDATION_VERSION="model-first-mainline-calibrated-v8"','RECOMMENDATION_VERSION="model-first-mainline-calibrated-v9"',1)
          needle='''assert SCHEMA_VERSION==10 and RUN_MODEL_MIN_GAMES>=450 and CAL_MIN_GAMES>=500;'''
          repl='''assert SCHEMA_VERSION==10 and RUN_MODEL_MIN_GAMES>=450 and CAL_MIN_GAMES>=500;assert displayed_stake_units({"confidence":6.19})==0 and displayed_stake_units({"confidence":6.2})==1 and displayed_stake_units({"confidence":6.99})==1 and displayed_stake_units({"confidence":7.0})==2 and displayed_stake_units({"confidence":7.99})==2 and displayed_stake_units({"confidence":8.0})==min(3,int(MAX_STAKE_UNITS));'''
          if needle not in s:
              raise SystemExit('self-test anchor not found')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
          python bot.py --self-test
      - name: Commit validated hotfix
        shell: bash
        run: |
          git config user.name "MLB Betting Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v10): display stake from model confidence"
          git push origin HEAD:hotfix-confidence-stake-display-20260811
