name: Temporary early stake preview hotfix

on:
  push:
    branches:
      - hotfix-early-final-stake-preview-20260811

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-early-final-stake-preview-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply early stake preview policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')
          repl={
            'if raw<.75 or max_u<1:return 0.0,0.0':'if raw<.25 or max_u<1:return 0.0,0.0',
            'Kelly prudent < 0.75u':'Kelly prudent < 0.25u',
            'VERSION="10.0.1"':'VERSION="10.0.2"',
            'RECOMMENDATION_VERSION="model-first-mainline-calibrated-v7"':'RECOMMENDATION_VERSION="model-first-mainline-calibrated-v8"',
            'assert MAX_STAKE_UNITS<3 or (integer_stake_units(.74*UNIT)[0]==0 and integer_stake_units(.75*UNIT)[0]==1 and integer_stake_units(1.49*UNIT)[0]==1 and integer_stake_units(1.50*UNIT)[0]==2 and integer_stake_units(2.49*UNIT)[0]==2 and integer_stake_units(2.50*UNIT)[0]==3)':'assert MAX_STAKE_UNITS<3 or (integer_stake_units(.24*UNIT)[0]==0 and integer_stake_units(.25*UNIT)[0]==1 and integer_stake_units(1.49*UNIT)[0]==1 and integer_stake_units(1.50*UNIT)[0]==2 and integer_stake_units(2.49*UNIT)[0]==2 and integer_stake_units(2.50*UNIT)[0]==3)'
          }
          for a,b in repl.items():
              if a not in s:
                  raise SystemExit(f'missing replacement target: {a}')
              s=s.replace(a,b)
          old='''    if phase=="EARLY":\n        if e.get("qualified") and cu>=1:\n            return f"👀 **PRIX SUFFISANT ({price:.2f})**, mais phase EARLY : surveillance uniquement\\n💰 **Mise théorique si la cote tient : {int(cu)}u = {cs:.2f} €** • mise maintenant **0u**"\n        return f"👀 **PRIX SUFFISANT ({price:.2f})**, mais phase EARLY : surveillance uniquement\\n💰 **Mise théorique : 0u**"'''
          new='''    if phase=="EARLY":\n        if e.get("qualified") and cu>=1:\n            return f"👀 **PRIX SUFFISANT ({price:.2f})** • phase EARLY\\n💰 **Mise recommandée si pari pris maintenant : {int(cu)}u = {cs:.2f} €** • simulation FINAL avec données/cote actuelles"\n        return f"👀 **PRIX SUFFISANT ({price:.2f})** • phase EARLY\\n💰 **Mise recommandée si pari pris maintenant : 0u** • critères actuels insuffisants"'''
          if old not in s:
              raise SystemExit('missing EARLY execution_status block')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
          python bot.py --self-test
      - name: Commit validated hotfix
        shell: bash
        run: |
          if git diff --quiet -- bot.py; then
            echo 'No bot.py changes to commit.'
            exit 0
          fi
          git config user.name 'MLB Betting Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'feat(v10): show FINAL-style stake preview in EARLY [skip ci]'
          git push origin HEAD:hotfix-early-final-stake-preview-20260811
