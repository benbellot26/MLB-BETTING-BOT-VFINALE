name: Temporary stake display no Winamax gate

on:
  push:
    branches:
      - hotfix-stake-display-no-winamax-gate-20260811

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-stake-display-no-winamax-gate-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove Winamax gate from displayed stake
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')
          old='''def execution_status(rec,phase):\n    if not rec:return "⚠️ Pas de recommandation modèle exploitable."\n    e=rec.get("winamax_eval");minimum=rec.get("min_price");du=displayed_stake_units(rec);ds=round(du*UNIT,2)\n    if not e:\n        return f"⚠️ **Cote Winamax absente du flux** • jouer uniquement si cote ≥ **{minimum:.2f}**\\n💰 **Mise conseillée : 0u** — attendre une cote exploitable"\n    price=num(e.get("price"),0)\n    if price+1e-9<minimum:\n        return f"❌ **BON PICK — PRIX TROP BAS** • Winamax {price:.2f} • minimum modèle **{minimum:.2f}**\\n💰 **Mise conseillée : 0u**"\n    if du<=0:\n        return f"⚪ **PRIX SUFFISANT ({price:.2f})**, mais confiance sous le seuil {MIN_PLAN_CONF:.1f}/10\\n💰 **Mise conseillée : 0u**"\n    phase_txt=f" • phase {phase}" if phase else ""\n    return f"✅ **PRIX SUFFISANT ({price:.2f})**{phase_txt}\\n💰 **Mise recommandée : {du}u = {ds:.2f} €** • basée sur la confiance modèle, indépendante de l’EV/Kelly"\n'''
          new='''def execution_status(rec,phase):\n    if not rec:return "⚠️ Pas de recommandation modèle exploitable."\n    e=rec.get("winamax_eval");minimum=rec.get("min_price");du=displayed_stake_units(rec);ds=round(du*UNIT,2)\n    phase_txt=f" • phase {phase}" if phase else ""\n    stake_txt=(f"💰 **Mise recommandée : {du}u = {ds:.2f} €**" if du>0 else f"💰 **Mise recommandée : 0u** • confiance sous le seuil {MIN_PLAN_CONF:.1f}/10")\n    if not e:\n        return f"ℹ️ **Winamax : cote absente du flux** • cote mini indicative **{minimum:.2f}**{phase_txt}\\n{stake_txt} • unité basée uniquement sur la confiance modèle"\n    price=num(e.get("price"),0)\n    price_txt=(f"ℹ️ **Winamax {price:.2f}** • cote mini indicative **{minimum:.2f}**" if price+1e-9>=minimum else f"⚠️ **Winamax {price:.2f} sous la cote mini indicative {minimum:.2f}**")\n    return f"{price_txt}{phase_txt}\\n{stake_txt} • unité basée uniquement sur la confiance modèle"\n'''
          if old not in s:
              raise SystemExit('execution_status block not found')
          s=s.replace(old,new,1)
          s=s.replace('VERSION="10.0.3"','VERSION="10.0.4"',1)
          s=s.replace('RECOMMENDATION_VERSION="model-first-mainline-calibrated-v9"','RECOMMENDATION_VERSION="model-first-mainline-calibrated-v10"',1)
          needle='''assert SCHEMA_VERSION==10 and RUN_MODEL_MIN_GAMES>=450 and CAL_MIN_GAMES>=500;'''
          repl='''assert SCHEMA_VERSION==10 and RUN_MODEL_MIN_GAMES>=450 and CAL_MIN_GAMES>=500;assert "2u" in execution_status({"confidence":7.5,"min_price":1.80,"winamax_eval":{"price":1.50}},"EARLY") and "sous la cote mini" in execution_status({"confidence":7.5,"min_price":1.80,"winamax_eval":{"price":1.50}},"EARLY");assert "2u" in execution_status({"confidence":7.5,"min_price":1.80,"winamax_eval":None},"EARLY");'''
          if needle not in s:
              raise SystemExit('self-test anchor not found')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile bot.py
          python bot.py --self-test
      - name: Commit validated hotfix
        shell: bash
        run: |
          git config user.name "MLB Betting Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v10): make displayed stake independent of Winamax price"
          git push origin HEAD:hotfix-stake-display-no-winamax-gate-20260811
