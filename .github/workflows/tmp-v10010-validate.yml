name: V10.0.10 Journal Validation

on:
  push:
    branches: [v10-0-10-live-journal-20260812]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-0-10-live-journal-20260812
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tmp_patch_v10010.py
      - name: Validate bot
        run: |
          python -m py_compile bot.py
          python bot.py --self-test
      - name: Validate journal isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('bot.py').read_text(encoding='utf-8')
          assert 'JOURNAL_FILE' in t
          assert 'v1010_append_run' in t
          assert 'v1010_settle_journal' in t
          assert 'model_proposed' in t
          print('journal hooks: OK')
          PY
      - name: Commit bot
        run: |
          git config user.name 'MLB Betting Bot CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then
            echo 'bot.py already patched'
            exit 0
          fi
          git commit -m 'feat: V10.0.10 add live betting journal'
          git push origin HEAD:v10-0-10-live-journal-20260812
