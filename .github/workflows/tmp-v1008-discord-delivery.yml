name: V10.0.8 Discord Delivery Bootstrap

on:
  push:
    branches:
      - discord-lineup-all-games-20260812

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: discord-lineup-all-games-20260812
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch bot.py
        run: python tmp_patch_v1008.py
      - name: Compile and self-test
        run: |
          python -m py_compile bot.py
          python bot.py --self-test
      - name: Commit bot.py
        run: |
          git config user.name "MLB Betting Bot CI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "bot.py already patched"
            exit 0
          fi
          git commit -m "feat: V10.0.8 Discord lineup status and all-game delivery"
          git push origin HEAD:discord-lineup-all-games-20260812
