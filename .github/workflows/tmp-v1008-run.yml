name: V10.0.8 Validation

on:
  push:
    branches: [discord-lineup-all-games-20260812]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: discord-lineup-all-games-20260812
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tmp_patch_v1008.py
      - name: Validate bot
        run: |
          python -m py_compile bot.py
          python bot.py --self-test
      - name: Verify workflow is manual only
        run: |
          python - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/mlb-bot.yml').read_text(encoding='utf-8')
          assert 'workflow_dispatch:' in y
          assert 'schedule:' not in y
          print('production workflow manual-only: OK')
          PY
      - name: Commit bot
        run: |
          git config user.name 'MLB Betting Bot CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then
            echo 'bot.py already patched'
            exit 0
          fi
          git commit -m 'feat: V10.0.8 Discord lineup status and all-game delivery'
          git push origin HEAD:discord-lineup-all-games-20260812
