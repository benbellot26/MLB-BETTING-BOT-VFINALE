name: V10.0.5 Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'v10-0-5-methodology-fixes-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and self-test
        run: |
          python -m py_compile bot.py
          python bot.py --self-test
      - name: Preserve settled V10 history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/mlb_history_v10.jsonl')
          assert p.exists(), 'historique V10 absent'
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          finals=[r for r in rows if r.get('status')=='FINAL']
          assert len(finals) >= 15, f'seulement {len(finals)} matchs FINAL'
          assert len({r.get('game_pk') for r in finals}) >= 15, 'moins de 15 matchs réglés uniques'
          print(f'historique préservé: {len(finals)} matchs FINAL uniques >= 15')
          PY
