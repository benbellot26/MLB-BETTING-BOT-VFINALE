name: V10.0.6 Run Seed Build

on:
  push:
    branches: [v10-0-6-run-seed-20260812]

permissions:
  contents: write

concurrency:
  group: v1006-run-seed
  cancel-in-progress: false

jobs:
  build-seed:
    if: ${{ !contains(github.event.head_commit.message, '[skip seed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v10-0-6-run-seed-20260812

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild leakage-safe FINAL-phase seed
        env:
          BACKTEST_START: '2026-03-01'
          BACKTEST_END: '2026-08-11'
          BACKTEST_WORKERS: '12'
        run: |
          git fetch origin backtest-2026-walkforward --depth=30
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git','show','ba8dc557af187d119978cc006bde4cd457269cec:backtest_2026.py'],
              text=True,
          )
          old = 'games=schedule();print(f"Regular-season finals {START} -> {END}: {len(games)}",flush=True)'
          new = 'games=schedule();games=sorted({g["game_pk"]:g for g in games}.values(),key=lambda x:(x["game_date"],x["game_pk"]));print(f"Regular-season finals {START} -> {END}: {len(games)}",flush=True)'
          assert old in source
          source = source.replace(old,new,1)
          needle = '"rl_proxy":{"name":rl_name'
          insert = '"run_seed":{"phase":"FINAL","base_home":round(bh,8),"base_away":round(ba,8),"run_features_home":[round(x,10) for x in fh],"run_features_away":[round(x,10) for x in fa]},"rl_proxy":{"name":rl_name'
          assert needle in source
          source = source.replace(needle,insert,1)
          Path('/tmp/backtest_seed.py').write_text(source,encoding='utf-8')
          PY
          BACKTEST_OUT=/tmp/enhanced.jsonl \
          BACKTEST_REPORT_JSON=/tmp/report.json \
          BACKTEST_REPORT_MD=/tmp/report.md \
          python /tmp/backtest_seed.py

      - name: Write compact seed file
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          rows=[]; seen=set()
          for line in Path('/tmp/enhanced.jsonl').read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              r=json.loads(line); gid=str(r['game_pk'])
              if gid in seen: continue
              seen.add(gid); s=r['run_seed']
              row={
                  'schema':'mlb-run-seed-2026-v1',
                  'source':'walk-forward-2026-final-phase',
                  'game_pk':r['game_pk'],
                  'game_date':r['game_date'],
                  'home':r['home'],'away':r['away'],
                  'home_score':r['home_score'],'away_score':r['away_score'],
                  'phase':'FINAL',
                  'base_home':s['base_home'],'base_away':s['base_away'],
                  'run_features_home':s['run_features_home'],
                  'run_features_away':s['run_features_away'],
              }
              assert len(row['run_features_home'])==17 and len(row['run_features_away'])==17
              vals=[row['base_home'],row['base_away'],*row['run_features_home'],*row['run_features_away']]
              assert all(math.isfinite(float(x)) for x in vals)
              rows.append(row)
          assert len(rows)>=1700, len(rows)
          out=Path('data/mlb_run_seed_2026.jsonl')
          out.write_text('\n'.join(json.dumps(r,separators=(',',':')) for r in rows)+'\n',encoding='utf-8')
          print(f'run seed ready: {len(rows)} unique FINAL-phase games')
          PY

      - name: Validate seed isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/mlb_run_seed_2026.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==len({str(r['game_pk']) for r in rows})
          assert all(r['phase']=='FINAL' for r in rows)
          assert all(len(r['run_features_home'])==17 and len(r['run_features_away'])==17 for r in rows)
          assert Path('data/mlb_history_v10.jsonl').exists()
          print(f'validated {len(rows)} unique seed games; live history untouched')
          PY

      - name: Commit seed only
        run: |
          git config user.name 'MLB Betting Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/mlb_run_seed_2026.jsonl
          git commit -m 'data: add 2026 FINAL-phase residual run seed [skip seed]'
          git push origin HEAD:v10-0-6-run-seed-20260812
