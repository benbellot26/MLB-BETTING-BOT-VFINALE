name: V10.0.7 Bootstrap

on:
  push:
    branches: [v10-0-7-selective-betting-20260812]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-0-7-selective-betting-20260812
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply prepared V10.0.7 block
        run: |
          python - <<'PY'
          from pathlib import Path
          bot=Path('bot.py')
          src=bot.read_text(encoding='utf-8')
          tag='# ======================= V10.0.7 SELECTIVE BETTING ========================'
          if tag not in src:
              wf=Path('.github/workflows/v1007-ci.yml').read_text(encoding='utf-8')
              start=wf.index("              block=r'''\n")+len("              block=r'''\n")
              end=wf.index("\n'''\n              src=src[:idx]",start)
              block=wf[start:end]
              idx=src.rfind('\nif __name__=="__main__":')
              if idx<0: raise SystemExit('final __main__ marker not found')
              src=src[:idx]+'\n'+block+'\n'+src[idx:]
          # Two reviewed corrections to the prepared block.
          src=src.replace('fav=(mp is not None and num(mp)<.5)==False if mp is not None else num(e.get("price"),2.01)<2','fav=(num(mp)>=.5) if mp is not None else num(e.get("price"),2.01)<2')
          old='''    for c in slate["pool"]:\n        if len(chosen)>=slate["max_bets"] or len(chosen)>=V1007_MAX_OFFICIAL_BETS:break\n        gid=str(c["result"]["game_pk"]);profile=c["profile"]'''
          new='''    thresholds=(70,72,74)\n    for c in slate["pool"]:\n        if len(chosen)>=slate["max_bets"] or len(chosen)>=V1007_MAX_OFFICIAL_BETS:break\n        if c["score"]<thresholds[len(chosen)]:break\n        gid=str(c["result"]["game_pk"]);profile=c["profile"]'''
          if old in src: src=src.replace(old,new,1)
          old2='''        if c["result"].get("phase")!="EARLY":continue\n        gid=str(c["result"]["game_pk"])'''
          new2='''        if c["result"].get("phase")!="EARLY" or c["score"]<70:continue\n        gid=str(c["result"]["game_pk"])'''
          if old2 in src: src=src.replace(old2,new2,1)
          bot.write_text(src,encoding='utf-8')
          PY
      - name: Compile and self-test
        run: |
          python -m py_compile bot.py
          python bot.py --self-test
      - name: Verify preserved datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          hist=[json.loads(x) for x in Path('data/mlb_history_v10.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          seed=[json.loads(x) for x in Path('data/mlb_run_seed_2026.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          finals={r.get('game_pk') for r in hist if r.get('status')=='FINAL'}
          seeds={str(r.get('game_pk')) for r in seed}
          assert len(finals)>=15, len(finals)
          assert len(seeds)>=1700, len(seeds)
          print('live finals',len(finals),'run seed',len(seeds))
          PY
      - name: Commit validated bot
        run: |
          if git diff --quiet -- bot.py; then
            echo 'No bot change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'feat(v10.0.7): selective official betting layer'
          git push origin HEAD:v10-0-7-selective-betting-20260812
