name: V10.0.11 Patch Validation

on:
  push:
    branches:
      - v10-0-11-open-markets-20260812

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[v1011 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-0-11-open-markets-20260812
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V10.0.11 layer
        run: python tools/patch_v1011.py
      - name: Compile
        run: python -m py_compile bot.py
      - name: Self test
        run: python bot.py --self-test
      - name: Structural checks
        run: |
          grep -q 'VERSION="10.0.11"' bot.py
          grep -q 'winamax_price_gate_enabled' bot.py
          grep -q 'alternate_totals' bot.py
          grep -q 'option_recs' bot.py
      - name: Commit patched bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No bot.py changes"
            exit 0
          fi
          git commit -m "V10.0.11 — open markets, Winamax info only [v1011 applied]"
          git push origin HEAD:v10-0-11-open-markets-20260812
