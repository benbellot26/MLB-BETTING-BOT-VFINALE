name: V11 Full 2026 Walk-Forward Backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-full-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-full-2026-walkforward
  cancel-in-progress: false

jobs:
  full-backtest:
    name: V11.1.5 full 2026 walk-forward
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout V11 development branch
        uses: actions/checkout@v4
        with:
          ref: agent/v11-predictive-core
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate walk-forward engine
        run: |
          python --version
          python -m py_compile bot.py v11_walkforward_backtest.py
          python v11_walkforward_backtest.py --self-test

      - name: Run all available 2026 games
        run: |
          python v11_walkforward_backtest.py \
            --start-date 2026-03-25 \
            --end-date 2026-08-13 \
            --max-games 0 \
            --workers 8 \
            --include-posted \
            --include-weather

      - name: Validate full-season outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows_path = Path('data/v11_walkforward_2026.jsonl')
          report_path = Path('data/v11_walkforward_2026_report.json')
          assert rows_path.exists() and rows_path.stat().st_size > 0
          assert report_path.exists() and report_path.stat().st_size > 0

          rows = [json.loads(x) for x in rows_path.read_text(encoding='utf-8').splitlines() if x.strip()]
          report = json.loads(report_path.read_text(encoding='utf-8'))

          assert len(rows) >= 1700, f'full backtest unexpectedly small: {len(rows)}'
          assert len({int(r['game_pk']) for r in rows}) == len(rows), 'duplicate game_pk in V11 walk-forward output'
          assert all(r.get('no_lookahead') is True for r in rows)
          assert all(r.get('official_effect') is False for r in rows)
          assert int(report['samples']['usable_predictions']) == len(rows)
          assert report.get('official_effect') is False
          assert report['methodology']['same_day_policy'].startswith('predict all games')

          print(f'validated full V11 walk-forward: {len(rows)} games')
          print(json.dumps({
              'all_base_brier': report['all']['models']['base_p_home']['brier'],
              'all_full_projected_brier': report['all']['models']['p_full_projected']['brier'],
              'holdout_gain': report['holdout_25pct']['models']['p_full_projected']['brier_gain'],
              'holdout_gain_probability': report['holdout_25pct']['models']['p_full_projected']['paired_gain_probability'],
              'full_projected_coverage': report['all']['coverage'].get('full_projected'),
          }, indent=2))
          PY

      - name: Upload full backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-full-2026-walkforward
          path: |
            data/v11_walkforward_2026.jsonl
            data/v11_walkforward_2026_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist results on V11 branch
        if: success()
        shell: bash
        run: |
          git config user.name 'MLB Betting Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/v11_walkforward_2026.jsonl data/v11_walkforward_2026_report.json
          if git diff --cached --quiet; then
            echo 'Backtest outputs unchanged.'
            exit 0
          fi
          git commit -m 'data: persist full V11.1.5 2026 walk-forward [skip ci]'
          git pull --rebase origin agent/v11-predictive-core
          git push origin HEAD:agent/v11-predictive-core
