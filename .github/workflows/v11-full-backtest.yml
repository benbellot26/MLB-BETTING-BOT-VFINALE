name: V11.2 Full 2026 Walk-Forward Backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-full-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-full-2026-walkforward
  cancel-in-progress: false

jobs:
  full-backtest:
    name: V11.2 train-only full 2026 evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout V11 development branch
        uses: actions/checkout@v4
        with:
          ref: agent/v11-predictive-core
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate V11.2 engines
        run: |
          python --version
          python -m py_compile bot.py v11_walkforward_backtest.py v11_2_optimizer.py
          python v11_walkforward_backtest.py --self-test
          python v11_2_optimizer.py --self-test

      - name: Run all available 2026 games
        run: |
          python v11_walkforward_backtest.py \
            --start-date 2026-03-25 \
            --end-date 2026-08-13 \
            --max-games 0 \
            --workers 8 \
            --include-posted \
            --include-weather

      - name: Train V11.2 on first 75 percent and grade final 25 percent
        run: |
          python v11_2_optimizer.py \
            --input data/v11_walkforward_2026.jsonl \
            --report data/v11_2_report.json \
            --predictions data/v11_2_predictions.jsonl

      - name: Validate full-season outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows_path = Path('data/v11_walkforward_2026.jsonl')
          v11_report_path = Path('data/v11_walkforward_2026_report.json')
          v12_report_path = Path('data/v11_2_report.json')
          v12_preds_path = Path('data/v11_2_predictions.jsonl')
          for p in (rows_path, v11_report_path, v12_report_path, v12_preds_path):
              assert p.exists() and p.stat().st_size > 0, p

          rows = [json.loads(x) for x in rows_path.read_text(encoding='utf-8').splitlines() if x.strip()]
          preds = [json.loads(x) for x in v12_preds_path.read_text(encoding='utf-8').splitlines() if x.strip()]
          rep = json.loads(v12_report_path.read_text(encoding='utf-8'))

          assert len(rows) >= 1700, f'full backtest unexpectedly small: {len(rows)}'
          assert len(preds) == len(rows)
          assert len({int(r['game_pk']) for r in rows}) == len(rows)
          assert all(r.get('no_lookahead') is True for r in preds)
          assert all(r.get('official_effect') is False for r in preds)
          assert rep.get('official_effect') is False
          assert rep['methodology']['holdout_used_for_selection'] is False
          assert rep['holdout']['n'] >= 300

          print(f'validated V11.2 on {len(rows)} games')
          print(json.dumps({
              'selected_params': rep['selected_params'],
              'holdout_base_brier': rep['holdout']['base_brier'],
              'holdout_v11_2_brier': rep['holdout']['v11_2_brier'],
              'holdout_brier_gain': rep['holdout']['brier_gain'],
              'holdout_logloss_gain': rep['holdout']['logloss_gain'],
              'holdout_gain_probability': rep['holdout']['paired_gain_probability'],
              'candidate_better_than_v10': rep['gate']['candidate_better_than_v10'],
              'passes_full_gate': rep['gate']['passes_full_production_evidence_gate'],
          }, indent=2))
          PY

      - name: Upload V11.2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-2-full-2026-walkforward
          path: |
            data/v11_walkforward_2026.jsonl
            data/v11_walkforward_2026_report.json
            data/v11_2_predictions.jsonl
            data/v11_2_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist results on V11 branch
        if: success()
        shell: bash
        run: |
          git config user.name 'MLB Betting Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/v11_walkforward_2026.jsonl data/v11_walkforward_2026_report.json data/v11_2_predictions.jsonl data/v11_2_report.json
          if git diff --cached --quiet; then
            echo 'Backtest outputs unchanged.'
            exit 0
          fi
          git commit -m 'data: persist V11.2 full-season evaluation [skip ci]'
          git pull --rebase origin agent/v11-predictive-core
          git push origin HEAD:agent/v11-predictive-core
