name: V11 2026 Walk-Forward Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Eastern date to start replay"
        required: true
        default: "2026-03-25"
      end_date:
        description: "Eastern date to stop replay"
        required: true
        default: "2026-08-13"
      max_games:
        description: "0 = all games in range; use 20-50 for smoke tests"
        required: true
        default: "0"
      workers:
        description: "Parallel MLB boxscore fetch workers"
        required: true
        default: "6"
      include_posted:
        description: "Grade historical batting order as POSTED_RETRO (never EARLY)"
        type: boolean
        required: true
        default: true
      include_weather:
        description: "Archive weather for audited park orientations (run means only)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: v11-walkforward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and pure regression test
        run: |
          python -m py_compile bot.py v11_walkforward_backtest.py
          python v11_walkforward_backtest.py --self-test

      - name: Run strict 2026 walk-forward
        shell: bash
        run: |
          args=(
            --start-date "${{ inputs.start_date }}"
            --end-date "${{ inputs.end_date }}"
            --max-games "${{ inputs.max_games }}"
            --workers "${{ inputs.workers }}"
          )
          if [[ "${{ inputs.include_posted }}" == "true" ]]; then
            args+=(--include-posted)
          fi
          if [[ "${{ inputs.include_weather }}" == "true" ]]; then
            args+=(--include-weather)
          fi
          python v11_walkforward_backtest.py "${args[@]}"

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = Path("data/v11_walkforward_2026.jsonl")
          report = Path("data/v11_walkforward_2026_report.json")
          assert rows.exists() and rows.stat().st_size > 0
          n = 0
          versions = set()
          with rows.open(encoding="utf-8") as fh:
              for line in fh:
                  if not line.strip():
                      continue
                  obj = json.loads(line)
                  assert obj.get("no_lookahead") is True
                  assert obj.get("official_effect") is False
                  assert 0 < float(obj["base_p_home"]) < 1
                  assert 0 < float(obj["p_full_projected"]) < 1
                  versions.add(obj.get("version"))
                  n += 1
          rep = json.loads(report.read_text(encoding="utf-8"))
          assert n == int(rep["samples"]["usable_predictions"])
          assert rep.get("official_effect") is False
          assert rep["methodology"]["same_day_policy"].startswith("predict all games")
          assert len(versions) == 1
          print(f"validated {n} walk-forward rows | version={next(iter(versions))}")
          PY

      - name: Persist backtest outputs
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v11_walkforward_2026.jsonl data/v11_walkforward_2026_report.json
          if git diff --cached --quiet; then
            echo "No backtest output change to commit."
          else
            git commit -m "data: persist V11.1.5 walk-forward backtest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
