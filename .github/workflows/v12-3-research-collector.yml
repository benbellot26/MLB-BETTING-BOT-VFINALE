name: MLB V13 Phase Research Collector

on:
  schedule:
    # Cheap hourly gate; the paid Odds API is called only when a new EARLY/LATE/FINAL phase is missing.
    - cron: '23 0-6,14-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check whether a new phase snapshot is actually needed
        id: gate
        run: |
          python -m py_compile v11/v13_research_gate.py
          python -m v11.v13_research_gate > /tmp/v13_research_gate.json
          cat /tmp/v13_research_gate.json
          run_needed=$(python -c "import json; d=json.load(open('/tmp/v13_research_gate.json')); print('true' if d.get('run_needed') else 'false')")
          echo "run_needed=$run_needed" >> "$GITHUB_OUTPUT"

      - name: Shared V13 critical preflight
        if: steps.gate.outputs.run_needed == 'true'
        run: |
          python -m py_compile v11/*.py tests/*.py
          python -m v11.v13_preflight

      - name: Build contract-strict predictive artifacts
        if: steps.gate.outputs.run_needed == 'true'
        run: |
          mkdir -p data runtime/v11
          python -m v11.v13_train
          python -m v11.v13_posterior_policy

      - name: Collect native V13 point-in-time research snapshot
        if: steps.gate.outputs.run_needed == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BANKROLL: ${{ vars.BANKROLL }}
          UNIT: ${{ vars.UNIT }}
          MIN_EV: ${{ vars.MIN_EV }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          V123_RESEARCH_ONLY: '1'
          V12_DEFER_DISCORD: '1'
          V1231_ENABLE_ALT_RUNLINES: '1'
          V1232_ENABLE_V115_SHADOW: '1'
          V124_ENABLE_SHADOW: '1'
        run: python -m v11.v13_entry

      - name: Assert no research recommendation was created
        if: steps.gate.outputs.run_needed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v11.probability_contract_v13 import MODEL_GENERATION_FINGERPRINT, row_is_predictively_compatible
          p = Path('runtime/v11/discord_payload.json')
          if not p.exists():
              raise SystemExit('research payload missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          if d.get('chosen'):
              raise SystemExit('research-only run produced chosen recommendations')
          if (d.get('combo') or {}).get('official'):
              raise SystemExit('research-only run produced an official combo')
          results=d.get('results') or []
          for r in results:
              if r.get('model_generation') != MODEL_GENERATION_FINGERPRINT:
                  raise SystemExit(f"research result generation mismatch: {r.get('game_pk')}")
          rows=[]
          live=Path('data/v11_3_live.jsonl')
          if live.exists():
              for line in live.read_text(encoding='utf-8').splitlines()[-250:]:
                  if line.strip():
                      try: rows.append(json.loads(line))
                      except Exception: pass
          current=[r for r in rows if r.get('model_generation') == MODEL_GENERATION_FINGERPRINT]
          if current and not all(row_is_predictively_compatible(r) for r in current):
              raise SystemExit('native V13 current-generation row missing predictive contract')
          print('V13 research-only safety + exact predictive generation OK; results=',len(results),'current_rows=',len(current))
          PY

      - name: Persist V13 phase observations
        if: steps.gate.outputs.run_needed == 'true'
        run: |
          git config user.name 'MLB Betting Bot V13 Research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v11_3_live.jsonl ] && git add data/v11_3_live.jsonl
          [ -f data/v11_3_live_report.json ] && git add data/v11_3_live_report.json
          [ -f data/v11_bet_ledger.jsonl ] && git add -f data/v11_bet_ledger.jsonl
          [ -f data/v13_baseball_calibration.json ] && git add -f data/v13_baseball_calibration.json
          [ -f data/v13_posterior_policy.json ] && git add -f data/v13_posterior_policy.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect native V13 phase snapshot [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Prepare V13 point-in-time archive
        if: steps.gate.outputs.run_needed == 'true'
        run: |
          mkdir -p runtime/v11/snapshots
          if [ -f data/v11_market_snapshots.jsonl ]; then
            gzip -9 -c data/v11_market_snapshots.jsonl > "runtime/v11/snapshots/v13_research_market_${GITHUB_RUN_ID}.jsonl.gz"
          fi

      - name: Archive V13 research sources
        if: steps.gate.outputs.run_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v13-phase-research-${{ github.run_id }}
          path: |
            runtime/v11/snapshots/
            runtime/v11/source_replays/
          if-no-files-found: ignore
          retention-days: 90
