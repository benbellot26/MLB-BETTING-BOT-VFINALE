name: MLB V12.3 Phase Research Collector

on:
  schedule:
    # Hourly across the normal MLB game window; captures EARLY/LATE/FINAL without publishing picks.
    - cron: '23 0-6,14-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect point-in-time research snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BANKROLL: ${{ vars.BANKROLL }}
          UNIT: ${{ vars.UNIT }}
          MIN_EV: ${{ vars.MIN_EV }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          V123_RESEARCH_ONLY: '1'
          V12_DEFER_DISCORD: '1'
        run: |
          mkdir -p data runtime/v11
          python -m v11.v123_entry

      - name: Assert no research recommendation was created
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runtime/v11/discord_payload.json')
          if not p.exists():
              raise SystemExit('research payload missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          if d.get('chosen'):
              raise SystemExit('research-only run produced chosen recommendations')
          if (d.get('combo') or {}).get('official'):
              raise SystemExit('research-only run produced an official combo')
          print('research-only safety gate OK')
          PY

      - name: Persist V12.3 phase observations
        run: |
          git config user.name 'MLB Betting Bot V12.3 Research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v11_3_live.jsonl ] && git add data/v11_3_live.jsonl
          [ -f data/v11_3_live_report.json ] && git add data/v11_3_live_report.json
          [ -f data/v11_bet_ledger.jsonl ] && git add -f data/v11_bet_ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect V12.3 phase snapshot [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Prepare point-in-time archive
        if: always()
        run: |
          mkdir -p runtime/v11/snapshots
          if [ -f data/v11_market_snapshots.jsonl ]; then
            gzip -9 -c data/v11_market_snapshots.jsonl > "runtime/v11/snapshots/research_market_${GITHUB_RUN_ID}.jsonl.gz"
          fi

      - name: Archive research sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-3-research-${{ github.run_id }}
          path: |
            runtime/v11/snapshots/
            runtime/v11/source_replays/
          if-no-files-found: ignore
          retention-days: 90
