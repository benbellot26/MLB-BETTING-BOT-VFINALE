name: MLB V13.10 Free Data Foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v13-7-free-data-collector.yml'
      - 'v11/v137_*.py'
      - 'v14/historical_dataset.py'
  schedule:
    # Free-only collector: no Odds API secret and no paid provider.
    - cron: '11 11 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Team-history backfill start (YYYY-MM-DD); blank = current season'
        required: false
        type: string
      end_date:
        description: 'Team-history backfill end (YYYY-MM-DD); blank = yesterday'
        required: false
        type: string
      weather_start_date:
        description: 'Optional archived-weather backfill start; blank = retry failed window or use cursor'
        required: false
        type: string
      weather_end_date:
        description: 'Optional archived-weather backfill end; blank = weather start'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  collect-free-data:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve free-data windows
        id: dates
        env:
          INPUT_START: ${{ inputs.start_date }}
          INPUT_END: ${{ inputs.end_date }}
          INPUT_WEATHER_START: ${{ inputs.weather_start_date }}
          INPUT_WEATHER_END: ${{ inputs.weather_end_date }}
        run: |
          yesterday="$(date -u -d 'yesterday' +%F)"
          year="$(date -u +%Y)"

          if [ -n "$INPUT_START" ]; then
            team_start="$INPUT_START"
          elif [ ! -f data/v137/team_features_2021.jsonl.gz ]; then
            team_start="2021-03-01"
          else
            team_start="${year}-03-01"
          fi
          team_end="${INPUT_END:-$yesterday}"

          if [ -n "$INPUT_WEATHER_START" ]; then
            weather_start="$INPUT_WEATHER_START"
            weather_end="${INPUT_WEATHER_END:-$INPUT_WEATHER_START}"
          elif [ -f data/v137_weather_backfill_report.json ] && python - <<'PY'
          import json
          r=json.load(open('data/v137_weather_backfill_report.json'))
          raise SystemExit(0 if int(r.get('rows') or 0)>0 and int(r.get('available_rows') or 0)==0 else 1)
          PY
          then
            # A failed provider window is retried before the cursor is allowed to move.
            weather_start="$(python -c "import json; print(json.load(open('data/v137_weather_backfill_report.json'))['start'])")"
            weather_end="$(python -c "import json; print(json.load(open('data/v137_weather_backfill_report.json'))['end'])")"
          else
            if [ -f data/v137_weather_cursor.json ]; then
              weather_end="$(python -c "import json; print(json.load(open('data/v137_weather_cursor.json')).get('next_end') or '$yesterday')")"
            else
              weather_end="$yesterday"
            fi
            if [[ "$weather_end" < "2024-03-14" ]]; then
              weather_end="2024-03-14"
            fi
            weather_start="$(date -u -d "$weather_end - 4 days" +%F)"
            if [[ "$weather_start" < "2024-03-14" ]]; then
              weather_start="2024-03-14"
            fi
          fi
          cutoff="$(date -u +%F)"
          echo "team_start=$team_start" >> "$GITHUB_OUTPUT"
          echo "team_end=$team_end" >> "$GITHUB_OUTPUT"
          echo "weather_start=$weather_start" >> "$GITHUB_OUTPUT"
          echo "weather_end=$weather_end" >> "$GITHUB_OUTPUT"
          echo "cutoff=$cutoff" >> "$GITHUB_OUTPUT"
          echo "season=$year" >> "$GITHUB_OUTPUT"
          printf 'team=%s..%s weather=%s..%s statcast_cutoff=%s season=%s\n' \
            "$team_start" "$team_end" "$weather_start" "$weather_end" "$cutoff" "$year"

      - name: V13.10 free-data preflight
        run: |
          python -m py_compile v11/*.py tests/*.py
          python -m v11.v13_preflight

      - name: Collect stable-ID Statcast priors
        run: |
          python -m v11.v137_statcast_daily \
            --cutoff "${{ steps.dates.outputs.cutoff }}" \
            --lookback-days 45 \
            --archive

      - name: Collect prior-only Statcast park factors
        run: |
          # Savant's three-season park-factor view is explicitly requested with rolling=3.
          # Provider regression tests assert both rolling=3 and a source year ending before the target season.
          python -m v11.v137_park_factors \
            --start-season 2021 \
            --end-season "${{ steps.dates.outputs.season }}"

      - name: Snapshot native MLB rosters and transactions
        run: |
          python -m v11.v137_mlb_state \
            --transaction-lookback-days 14 \
            --archive

      - name: Rebuild free team history
        run: |
          python -m v11.v137_team_history \
            --start "${{ steps.dates.outputs.team_start }}" \
            --end "${{ steps.dates.outputs.team_end }}"

      - name: Rebind strict historical source manifest
        run: |
          python -m v14.historical_dataset refresh-manifest

      - name: Collect archived point-in-time weather
        run: |
          python -m v11.v137_weather_backfill \
            --start "${{ steps.dates.outputs.weather_start }}" \
            --end "${{ steps.dates.outputs.weather_end }}" \
            --lead-hours 2 \
            --persist

      - name: Refresh free-data and model health
        run: |
          python -m v11.v137_free_data_health
          python -m v11.v13_model_health

      - name: Assert free-only provider integrity and cohort boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('data/v137_free_data_health.json').read_text(encoding='utf-8'))
          if h.get('paid_sources_required') is not False:
              raise SystemExit('free-data workflow unexpectedly requires a paid provider')
          providers=' '.join(str(x) for x in (h.get('providers') or {}).values()).lower()
          forbidden=('the odds api','sportsdataio','pinnacle')
          if any(x in providers for x in forbidden):
              raise SystemExit(f'paid/market provider leaked into free foundation: {providers}')
          team=h.get('team_history') or {}
          stat=h.get('statcast') or {}
          weather=h.get('weather') or {}
          park=h.get('park_factors') or {}
          native=h.get('mlb_native_state') or {}
          if any(x.get('promotion_eligible') for x in (team, stat, weather, park, native)):
              raise SystemExit('free data artifact bypassed model promotion gates')
          if stat and not stat.get('stable_id_only'):
              raise SystemExit('Statcast priors lost stable-ID-only contract')
          if stat.get('unresolved_truncation') or int(stat.get('chunks_failed') or 0):
              raise SystemExit('Statcast provider integrity is incomplete/truncated')
          if park and int(park.get('total_venue_rows') or 0)==0:
              raise SystemExit('Park-factor provider parsed zero venue rows')
          if weather and int(weather.get('rows') or 0)>0 and int(weather.get('available_rows') or 0)==0:
              raise SystemExit('Open-Meteo historical run produced zero available weather rows')
          if native and (not native.get('point_in_time') or not native.get('native_live')):
              raise SystemExit('MLB native state lost point-in-time/native-live contract')
          print('V13.10 free provider integrity + reconstructed/native separation OK')
          PY

      - name: Advance archived-weather backfill cursor only after valid provider data
        if: ${{ inputs.weather_start_date == '' || inputs.weather_start_date == null }}
        env:
          WEATHER_START: ${{ steps.dates.outputs.weather_start }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          from pathlib import Path
          floor=date(2024,3,14)
          start=date.fromisoformat(os.environ['WEATHER_START'])
          next_end=start-timedelta(days=1)
          complete=next_end < floor
          payload={
              "schema":"v13-7-free-weather-cursor-v2",
              "next_end": floor.isoformat() if complete else next_end.isoformat(),
              "complete_through_archive_start": complete,
              "archive_start": floor.isoformat(),
          }
          Path('data/v137_weather_cursor.json').write_text(json.dumps(payload,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Persist free-data foundation
        run: |
          git config user.name 'MLB Betting Bot V13.10 Free Data'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -d data/v137 ] && git add -f data/v137
          [ -f data/v138_dataset_manifest.json ] && git add -f data/v138_dataset_manifest.json
          [ -f data/v137_statcast_priors_latest.json.gz ] && git add -f data/v137_statcast_priors_latest.json.gz
          [ -f data/v137_statcast_priors_report.json ] && git add -f data/v137_statcast_priors_report.json
          [ -f data/v137_park_factors.json ] && git add -f data/v137_park_factors.json
          [ -f data/v137_park_factors_report.json ] && git add -f data/v137_park_factors_report.json
          [ -f data/v137_mlb_state_latest.json.gz ] && git add -f data/v137_mlb_state_latest.json.gz
          [ -f data/v137_mlb_state_report.json ] && git add -f data/v137_mlb_state_report.json
          [ -f data/v137_free_team_history_report.json ] && git add -f data/v137_free_team_history_report.json
          [ -f data/v137_weather_backfill_report.json ] && git add -f data/v137_weather_backfill_report.json
          [ -f data/v137_weather_cursor.json ] && git add -f data/v137_weather_cursor.json
          [ -f data/v137_free_data_health.json ] && git add -f data/v137_free_data_health.json
          [ -f data/v13_model_health.json ] && git add -f data/v13_model_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh V13.10 free data foundation [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
