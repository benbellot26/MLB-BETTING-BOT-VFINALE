name: MLB V13.10 Deep Audit Research

on:
  pull_request:
    paths:
      - 'v11/v138_*.py'
      - 'v11/v139_*.py'
      - 'v11/v1310_*.py'
      - 'v11/v13_engine.py'
      - 'v11/v13_runtime.py'
      - 'v11/market.py'
      - 'v11/v13_entry.py'
      - 'v11/v13_discord_delivery.py'
      - 'v11/discord_v13.py'
      - 'v11/v13_preflight.py'
      - 'tests/test_v138_*.py'
      - 'tests/test_v139_*.py'
      - 'tests/test_v1310_*.py'
      - '.github/workflows/v13-8-audit-closure.yml'
  push:
    branches: [main]
    paths:
      - 'v11/v138_*.py'
      - 'v11/v139_*.py'
      - 'v11/v1310_*.py'
      - 'v11/v13_engine.py'
      - 'v11/v13_runtime.py'
      - 'v11/market.py'
      - 'v11/v13_entry.py'
      - 'v11/v13_discord_delivery.py'
      - 'v11/discord_v13.py'
      - 'v11/v13_preflight.py'
      - 'tests/test_v138_*.py'
      - 'tests/test_v139_*.py'
      - 'tests/test_v1310_*.py'
      - '.github/workflows/v13-8-audit-closure.yml'
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V13 closure modules
        run: python -m py_compile v11/*.py tests/*.py
      - name: Shared V13.10 critical preflight
        run: python -m v11.v13_preflight
      - name: Assert legacy 90-point coverage inventory
        run: python -m v11.v139_engineering_closure --assert-closed
      - name: Assert V13.10 independent deep-audit engineering closure
        run: python -m v11.v1310_deep_audit_closure --assert-engineering
      - name: Direct V13.8/V13.9/V13.10 closure suites
        run: python -m unittest -v tests.test_v138_audit_closure tests.test_v138_inning_history tests.test_v138_native_evidence tests.test_v138_production_change_gate tests.test_v139_provider_hardening tests.test_v139_explicit_engine tests.test_v139_engineering_closure tests.test_v1310_deep_audit_hardening tests.test_v1310_deep_audit_registry

  research-artifacts:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free analytical storage dependency
        run: python -m pip install --disable-pip-version-check 'duckdb>=1.0,<2'
      - name: Backfill free MLB inning and extra-inning evidence
        run: |
          python -m v11.v138_inning_history \
            --start 2021-04-01 \
            --end "$(date -u -d 'yesterday' +%F)" \
            --per-season 60
      - name: Train reconstructed-data challengers
        run: python -m v11.v138_research_models
      - name: Run strict temporal validation
        run: python -m v11.v138_validation_entry
      - name: Refresh native/PIT evidence gates
        run: python -m v11.v138_native_evidence
      - name: Build versioned DuckDB and Parquet research store
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python -m v11.v138_dataset_store
      - name: Bind research reports to strong dataset content identity
        run: python -m v11.v138_research_integrity
      - name: Refresh monitoring and HTML dashboard
        run: python -m v11.v138_monitoring
      - name: Refresh truthful 52-point evidence registry
        run: python -m v11.v138_audit_closure
      - name: Refresh legacy 90-point coverage inventory
        run: python -m v11.v139_engineering_closure --assert-closed --write
      - name: Refresh V13.10 deep-audit closure registry
        run: python -m v11.v1310_deep_audit_closure --assert-engineering --write
      - name: Assert validation isolation and evidence integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/v138_research_models.json').read_text())
          v=json.loads(Path('data/v138_validation.json').read_text())
          manifest=json.loads(Path('data/v138_dataset_manifest.json').read_text())
          a=json.loads(Path('data/v138_audit_closure.json').read_text())
          n=json.loads(Path('data/v138_native_evidence.json').read_text())
          e=json.loads(Path('data/v139_engineering_closure.json').read_text())
          deep=json.loads(Path('data/v1310_deep_audit_closure.json').read_text())
          if m.get('promotion_eligible') is not False or m.get('research_only') is not True:
              raise SystemExit('reconstructed V13.8 model became promotion eligible')
          if m.get('holdout_isolation') is not True:
              raise SystemExit('ensemble selection leaked into final holdout')
          if 'naive' not in (m.get('ensemble_weights') or {}):
              raise SystemExit('research ensemble lost transparent baseline guardrail')
          strong=manifest.get('dataset_content_sha256')
          if not strong or len(str(strong)) != 64:
              raise SystemExit('strong dataset content fingerprint missing')
          if m.get('dataset_content_sha256') != strong or v.get('dataset_content_sha256') != strong:
              raise SystemExit('research/validation artifacts are not bound to the exact dataset bytes')
          if not (m.get('dataset_integrity') or {}).get('bound'):
              raise SystemExit('research model dataset integrity binding missing')
          if a.get('engineering_closed') != 52 or a.get('engineering_open') != 0:
              raise SystemExit('52-point engineering closure registry incomplete')
          pending=sum(not bool(p.get('evidence_closed')) for p in (a.get('points') or []))
          if pending != int(a.get('evidence_gates_pending') or 0):
              raise SystemExit('closure registry pending-count mismatch')
          if e.get('total') != 90 or e.get('engineering_closed') != 90 or e.get('engineering_open') != 0:
              raise SystemExit('legacy reconstructed 90-point coverage inventory incomplete')
          if deep.get('total_findings') != 35 or deep.get('engineering_closed') != 35 or deep.get('engineering_open') != 0:
              raise SystemExit('V13.10 deep-audit engineering registry incomplete')
          for market,count in (n.get('market_counts') or {}).items():
              if int(count or 0) < 300:
                  for key in ('uncertainty_coverage','dynamic_calibration'):
                      market_gate=(((n.get(key) or {}).get('by_market') or {}).get(market) or {})
                      if market_gate.get('active'):
                          raise SystemExit(f'{key}/{market} bypassed the market-specific native minimum')
          print('V13.10 validation isolation + strong dataset identity + 35-point engineering closure OK; evidence pending=',deep.get('evidence_pending'))
          PY
      - name: Persist V13 research and closure artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'MLB Betting Bot V13.10 Research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v138_inning_history.json.gz ] && git add -f data/v138_inning_history.json.gz
          [ -f data/v138_inning_evidence.json ] && git add -f data/v138_inning_evidence.json
          [ -f data/v138_book_probabilities.jsonl ] && git add -f data/v138_book_probabilities.jsonl
          [ -f data/v138_native_evidence.json ] && git add -f data/v138_native_evidence.json
          [ -f data/v138_research_models.json ] && git add -f data/v138_research_models.json
          [ -f data/v138_validation.json ] && git add -f data/v138_validation.json
          [ -f data/v138_dataset_manifest.json ] && git add -f data/v138_dataset_manifest.json
          [ -f data/v138_monitoring.json ] && git add -f data/v138_monitoring.json
          [ -f data/v138_provider_health.jsonl ] && git add -f data/v138_provider_health.jsonl
          [ -f data/v138_dashboard.html ] && git add -f data/v138_dashboard.html
          [ -f data/v138_audit_closure.json ] && git add -f data/v138_audit_closure.json
          [ -f data/v139_engineering_closure.json ] && git add -f data/v139_engineering_closure.json
          [ -f data/v1310_deep_audit_closure.json ] && git add -f data/v1310_deep_audit_closure.json
          [ -d data/v138 ] && git add -f data/v138
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh V13.10 research and audit evidence [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
