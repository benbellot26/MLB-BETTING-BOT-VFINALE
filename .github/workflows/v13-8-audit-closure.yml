name: MLB V13.8 Audit Closure Research

on:
  pull_request:
    paths:
      - 'v11/v138_*.py'
      - 'v11/v13_discord_delivery.py'
      - 'v11/discord_v13.py'
      - 'v11/v13_preflight.py'
      - 'tests/test_v138_audit_closure.py'
      - '.github/workflows/v13-8-audit-closure.yml'
  push:
    branches: [main]
    paths:
      - 'v11/v138_*.py'
      - 'v11/v13_discord_delivery.py'
      - 'v11/discord_v13.py'
      - 'v11/v13_preflight.py'
      - 'tests/test_v138_audit_closure.py'
      - '.github/workflows/v13-8-audit-closure.yml'
  schedule:
    - cron: '47 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V13.8 closure modules
        run: python -m py_compile v11/*.py tests/*.py
      - name: Shared critical preflight
        run: python -m v11.v13_preflight
      - name: Direct V13.8 closure suite
        run: python -m unittest -v tests.test_v138_audit_closure

  research-artifacts:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free analytical storage dependency
        run: python -m pip install --disable-pip-version-check 'duckdb>=1.0,<2'
      - name: Train reconstructed-data challengers
        run: python -m v11.v138_research_models
      - name: Run strict temporal validation
        run: python -m v11.v138_validation_entry
      - name: Build versioned DuckDB and Parquet research store
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python -m v11.v138_dataset_store
      - name: Refresh monitoring and HTML dashboard
        run: python -m v11.v138_monitoring
      - name: Refresh truthful 52-point closure registry
        run: python -m v11.v138_audit_closure
      - name: Assert no reconstructed evidence can promote production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/v138_research_models.json').read_text())
          a=json.loads(Path('data/v138_audit_closure.json').read_text())
          if m.get('promotion_eligible') is not False or m.get('research_only') is not True:
              raise SystemExit('reconstructed V13.8 model became promotion eligible')
          if a.get('engineering_closed') != 52 or a.get('engineering_open') != 0:
              raise SystemExit('52-point engineering closure registry incomplete')
          if a.get('evidence_gates_pending',0) <= 0:
              raise SystemExit('evidence gates were incorrectly bypassed')
          print('V13.8 engineering closure complete; statistical evidence gates remain fail-closed')
          PY
      - name: Persist V13.8 research artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'MLB Betting Bot V13.8 Research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v138_research_models.json ] && git add -f data/v138_research_models.json
          [ -f data/v138_validation.json ] && git add -f data/v138_validation.json
          [ -f data/v138_dataset_manifest.json ] && git add -f data/v138_dataset_manifest.json
          [ -f data/v138_monitoring.json ] && git add -f data/v138_monitoring.json
          [ -f data/v138_provider_health.jsonl ] && git add -f data/v138_provider_health.jsonl
          [ -f data/v138_dashboard.html ] && git add -f data/v138_dashboard.html
          [ -f data/v138_audit_closure.json ] && git add -f data/v138_audit_closure.json
          [ -d data/v138 ] && git add -f data/v138
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh V13.8 audit closure research [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
