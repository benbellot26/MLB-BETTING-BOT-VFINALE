name: V13 Backfill Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v13-backfill-bootstrap.yml'
      - 'v11/v13_historical_backfill.py'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download durable source replays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/v13/replays
          gh release download v12-data-archive --pattern '*_sources.json.gz' --dir runtime/v13/replays --clobber
          test $(find runtime/v13/replays -name '*_sources.json.gz' | wc -l) -gt 0
      - name: Backfill
        run: python -m v11.v13_historical_backfill --dir runtime/v13/replays
      - name: Validate and persist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/v13_historical_backfill_report.json').read_text())
          assert r['replay_pass'] > 0, r
          assert r['canonical_games'] > 0, r
          print(json.dumps({k:r[k] for k in ('source_replays','replay_pass','replay_fail','canonical_rows','canonical_games','phase_counts','settled_options_by_market')},indent=2))
          PY
          git config user.name 'MLB Betting Bot V13'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/v13_historical_backfill.jsonl data/v13_historical_backfill_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist first V13 historical backfill [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
