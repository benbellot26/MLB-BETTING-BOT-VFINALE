name: V13 Daily Post-Mortem

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and smoke test
        run: |
          python -m py_compile v11/v13_daily_postmortem.py v11/v13_daily_tracking.py v11/v13_tracking_sync.py v11/v13_feature_store.py v11/v13_exact_transfer_evidence.py v11/v13_run_mean_prior.py v11/v13_distribution_prior.py v11/v13_probability_diagnostics.py v11/v1310_market_diagnostics.py v11/v13_champion_dashboard.py
          python -m unittest tests.test_v13_daily_postmortem tests.test_v13_daily_tracking tests.test_v1310_max_audit_hardening tests.test_v1310_champion_dashboard tests.test_v1310_prefreeze_hardening
      - name: Sync, settle and send yesterday report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m v11.v13_daily_postmortem --sync --send
      - name: Refresh native FINAL evidence and strict transfer gates
        run: |
          python -m v11.v13_feature_store
          python -m v11.v13_run_mean_prior
          python -m v11.v13_distribution_prior
          python -m v11.v13_train
          python -m v11.v13_posterior_policy
          python -m v11.v13_probability_diagnostics
          python -m v11.v13_champion_dashboard
          python -m v11.v13_model_health
      - name: Persist tracking, postmortem and refreshed evidence
        run: |
          git config user.name 'MLB Betting Bot V13'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v13_market_tracking.jsonl ] && git add -f data/v13_market_tracking.jsonl
          [ -f data/v13_market_tracking_report.json ] && git add -f data/v13_market_tracking_report.json
          [ -f data/v13_daily_postmortem.json ] && git add -f data/v13_daily_postmortem.json
          [ -f data/v13_feature_store.jsonl ] && git add -f data/v13_feature_store.jsonl
          [ -f data/v13_label_store.jsonl ] && git add -f data/v13_label_store.jsonl
          [ -f data/v13_run_mean_prior.json ] && git add -f data/v13_run_mean_prior.json
          [ -f data/v13_distribution_prior.json ] && git add -f data/v13_distribution_prior.json
          [ -f data/v13_baseball_calibration.json ] && git add -f data/v13_baseball_calibration.json
          [ -f data/v13_posterior_policy.json ] && git add -f data/v13_posterior_policy.json
          [ -f data/v13_probability_diagnostics.json ] && git add -f data/v13_probability_diagnostics.json
          [ -f data/v13_champion_dashboard.json ] && git add -f data/v13_champion_dashboard.json
          [ -f data/v13_champion_dashboard.md ] && git add -f data/v13_champion_dashboard.md
          [ -f data/v13_model_health.json ] && git add -f data/v13_model_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily V13 postmortem and evidence refresh [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
