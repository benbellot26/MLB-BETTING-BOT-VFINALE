name: V13 Daily Post-Mortem

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and smoke test
        run: |
          python -m py_compile v11/v13_daily_postmortem.py v11/v13_daily_tracking.py v11/v13_tracking_sync.py
          python -m unittest tests.test_v13_daily_postmortem
      - name: Sync, settle and send yesterday report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m v11.v13_daily_postmortem --sync --send
      - name: Persist tracking and daily report
        run: |
          git config user.name 'MLB Betting Bot V13'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v13_market_tracking.jsonl ] && git add -f data/v13_market_tracking.jsonl
          [ -f data/v13_market_tracking_report.json ] && git add -f data/v13_market_tracking_report.json
          [ -f data/v13_daily_postmortem.json ] && git add -f data/v13_daily_postmortem.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily V13 postmortem [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
