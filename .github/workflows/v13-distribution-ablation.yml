name: V13 Distribution Ablation

on:
  push:
    branches: [agent/v13-reconstruct-1801]
    paths:
      - 'v11/v13_distribution_ablation.py'
      - '.github/workflows/v13-distribution-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ablation
        run: python -m v11.v13_distribution_ablation
      - name: Validate selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/v13_distribution_ablation_report.json').read_text())
          assert r['warm_games'] >= 1600, r
          assert r['test_games'] >= 250, r
          assert r['exact_replay_games'] >= 20, r
          print(json.dumps(r,indent=2))
          PY
