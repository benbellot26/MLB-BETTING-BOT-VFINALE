name: V13 Historical Point-in-Time Backfill

on:
  # Run in the quiet gap between the overnight and evening production windows.
  # This turns durable pregame source replays into current-generation FINAL
  # transfer evidence before the daily historical-transfer validator runs.
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

# This workflow persists predictive evidence back to main. It must share the
# same repository-state lock as production/free-data/research writers so two
# workflows cannot independently rebase and push competing evidence states.
concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shared V13.10+ critical preflight
        run: |
          python -m py_compile v11/*.py tests/*.py
          python -m v11.v13_preflight --verbose
          python -m v11.v13_entry --self-test

      - name: Download durable pregame source replays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/v13/replays
          gh release download v12-data-archive --pattern '*_sources.json.gz' --dir runtime/v13/replays --clobber
          count=$(find runtime/v13/replays -name '*_sources.json.gz' | wc -l)
          echo "Downloaded $count source replays"
          test "$count" -gt 0

      - name: Reconstruct current-generation V13 probabilities point-in-time
        run: |
          python -m v11.v13_historical_backfill --dir runtime/v13/replays \
            --output data/v13_historical_backfill.jsonl \
            --report data/v13_historical_backfill_report.json

      - name: Verify reconstructed pre-candidate baselines and push parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v11 import probability_contract_v13 as contract

          report=json.loads(Path('data/v13_historical_backfill_report.json').read_text())
          canonical=int(report.get('canonical_rows') or 0)
          baselines=int(report.get('validation_baseline_rows') or 0)
          generations=int(report.get('validation_generation_rows') or 0)
          candidates=int(report.get('calibration_candidate_rows') or 0)
          options=int(report.get('calibration_baseline_options') or 0)
          assert canonical > 0, report
          assert report.get('model_generation') == contract.MODEL_GENERATION_FINGERPRINT, report
          assert baselines == canonical, report
          assert generations == canonical, report
          assert candidates == canonical, report
          assert options >= candidates, report
          assert not (report.get('calibration_rejection_reasons') or {}), report
          assert 'P(WIN | no PUSH)' in str(report.get('binary_probability_conditioning') or ''), report

          rows=[]
          for line in Path('data/v13_historical_backfill.jsonl').read_text().splitlines():
              if line.strip(): rows.append(json.loads(line))
          checked=0
          for row in rows:
              for opt in row.get('options') or []:
                  if str(opt.get('market') or '').upper() not in {'RUNLINE','TOTAL'}: continue
                  if opt.get('result') not in {'WIN','LOSS'}: continue
                  if opt.get('p_replay_baseline_raw') is None: continue
                  checked += 1
                  assert opt.get('replay_probability_conditioning') == 'WIN_GIVEN_NO_PUSH', (row.get('game_pk'),opt)
                  p=float(opt['p_replay_baseline_raw'])
                  push=float(opt.get('p_replay_baseline_push') or 0)
                  assert 0 < p < 1 and 0 <= push < 1, (row.get('game_pk'),opt)
          assert checked > 0
          print('V13 baseline preflight OK:', canonical, 'rows /', options, 'settled baseline options / push-parity options=',checked)
          PY

      - name: Rebuild 2021-2026 FINAL run-mean transfer candidate
        run: python -m v11.v13_run_mean_prior

      - name: Rebuild 2021-2026 FINAL score-distribution transfer
        run: python -m v11.v13_distribution_prior

      - name: Rebuild baseball calibration from native + exact replay evidence
        run: python -m v11.v13_train

      - name: Build unique-game blocked historical predictive validation
        run: python -m v11.v13_historical_validation

      - name: Build learned posterior shadow policy
        run: python -m v11.v13_posterior_policy

      - name: Validate leakage boundary and strict historical transfer states
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v11 import probability_contract_v13 as contract
          from v11 import v13_distribution_prior, v13_run_mean_prior

          report=json.loads(Path('data/v13_historical_backfill_report.json').read_text())
          assert report['source_replays'] > 0, report
          assert report['replay_pass'] > 0, report
          assert report['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, report
          rows=[]
          p=Path('data/v13_historical_backfill.jsonl')
          for line in p.read_text().splitlines():
              if line.strip(): rows.append(json.loads(line))

          candidates=0
          rejected=0
          for r in rows:
              assert r['point_in_time'] is True
              assert r['features_from_postgame'] is False
              assert r['market_probability_used_as_baseball_feature'] is False
              assert r['result_status'] == 'SETTLED'
              assert contract.row_is_predictively_compatible(r), r.get('game_pk')
              if r.get('calibration_evidence_candidate'):
                  candidates += 1
                  assert r.get('validation_baseline_model_generation') == contract.MODEL_GENERATION_FINGERPRINT, r.get('game_pk')
                  assert r.get('validation_baseline_home_runs') is not None, r.get('game_pk')
                  assert r.get('validation_baseline_away_runs') is not None, r.get('game_pk')
                  assert r.get('validation_baseline_dispersion') is not None, r.get('game_pk')
                  assert r.get('validation_baseline_environment_sigma') is not None, r.get('game_pk')
                  assert int(r.get('calibration_baseline_options') or 0) > 0, r.get('game_pk')
              else:
                  rejected += 1
                  assert r.get('calibration_evidence_rejection_reason'), r.get('game_pk')

          assert candidates == int(report.get('calibration_candidate_rows') or 0), report
          assert rejected == int(report.get('calibration_rejected_rows') or 0), report
          assert candidates > 0, report

          final_games=len({str(r.get('game_pk')) for r in rows
                           if str(r.get('phase') or '').upper() == 'FINAL'
                           and r.get('calibration_evidence_candidate')})

          prior=json.loads(Path('data/v13_run_mean_prior.json').read_text())
          assert prior['schema'] == v13_run_mean_prior.SCHEMA, prior
          assert prior['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, prior
          assert int(prior.get('exact_final_games') or 0) <= final_games
          assert set(prior.get('historical_seasons') or []) >= {2021,2022,2023,2024,2025,2026}, prior
          if prior.get('active'):
              assert prior.get('historical_candidate_active') is True, prior
              assert (prior.get('walk_forward') or {}).get('stable') is True, prior
              assert int(prior.get('exact_final_games') or 0) >= max(v13_run_mean_prior.MIN_EXACT_FINAL, int(prior.get('exact_transfer_required_games') or 0)), prior
              assert prior.get('exact_transfer_status') == 'PASS_FINAL_ONLY', prior
              assert (prior.get('exact_transfer_bootstrap') or {}).get('passes') is True, prior
              assert (prior.get('safety') or {}).get('exact_transfer_games_excluded_from_historical_fit') is True, prior

          dist=json.loads(Path('data/v13_distribution_prior.json').read_text())
          assert dist['schema'] == v13_distribution_prior.SCHEMA, dist
          assert dist['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, dist
          assert dist.get('historical_candidate_active') is True, dist
          assert (dist.get('walk_forward') or {}).get('stable') is True, dist
          assert int((dist.get('walk_forward') or {}).get('folds_passed') or 0) == int((dist.get('walk_forward') or {}).get('folds_total') or 0), dist
          assert set(dist.get('historical_seasons') or []) >= {2021,2022,2023,2024,2025,2026}, dist
          assert int(dist.get('exact_final_games') or 0) <= final_games
          if dist.get('active'):
              assert int(dist.get('exact_final_games') or 0) >= max(v13_distribution_prior.MIN_EXACT_FINAL, int(dist.get('exact_transfer_required_games') or 0)), dist
              assert dist.get('exact_transfer_status') == 'PASS_FINAL_ONLY', dist
              assert float((dist.get('current_generation_transfer') or {}).get('nll_gain') or 0) > 0, dist
              assert (dist.get('exact_transfer_bootstrap') or {}).get('passes') is True, dist
              assert (dist.get('safety') or {}).get('exact_transfer_games_excluded_from_historical_fit') is True, dist

          calibration=json.loads(Path('data/v13_baseball_calibration.json').read_text())
          assert calibration['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, calibration
          assert calibration.get('training_policy',{}).get('exact_v13_replay_backfill_allowed') is True, calibration

          hist=json.loads(Path('data/v13_historical_validation.json').read_text())
          assert hist['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, hist
          assert hist.get('source') == 'exact archived pregame source replays', hist
          assert hist.get('promotion_sample_unit') == 'unique game; pooled comparison keeps one latest pregame phase per game', hist
          for market, comparison in (hist.get('comparisons') or {}).items():
              assert int(comparison.get('unique_games') or 0) <= int(hist.get('canonical_games') or 0), (market,comparison)
              assert int(comparison.get('n') or 0) == int(comparison.get('unique_games') or 0), (market,comparison)
          assert set((hist.get('comparisons_by_phase') or {}).keys()) == {'ML','RUNLINE','TOTAL'}, hist

          policy=json.loads(Path('data/v13_posterior_policy.json').read_text())
          assert policy.get('model_generation') == contract.MODEL_GENERATION_FINGERPRINT, policy
          assert policy.get('primary_probability_affected') is False, policy
          assert policy.get('promotion_requires_unique_games') is True, policy
          for key, entry in (policy.get('entries') or {}).items():
              assert 0 <= float(entry.get('weight') or 0) <= 1, (key,entry)
              if entry.get('active_for_shadow'):
                  assert float(entry.get('holdout_brier_gain') or 0) > 0, (key,entry)
                  assert float(entry.get('holdout_logloss_gain') or 0) > 0, (key,entry)

          print('V13 backfill rows=',len(rows),'games=',report['canonical_games'],
                'candidates=',candidates,'rejected=',rejected,
                'run_mean=',prior.get('exact_final_games'),'/',prior.get('exact_transfer_required_games'),prior.get('exact_transfer_status'),prior.get('active'),
                'distribution=',dist.get('exact_final_games'),'/',dist.get('exact_transfer_required_games'),dist.get('exact_transfer_status'),dist.get('active'),
                'calibration_games=',calibration.get('eligible_games'),
                'historical_validation=',hist.get('canonical_games'))
          PY

      - name: Upload backfill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-historical-backfill-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/v13_historical_backfill.jsonl
            data/v13_historical_backfill_report.json
            data/v13_run_mean_prior.json
            data/v13_distribution_prior.json
            data/v13_baseball_calibration.json
            data/v13_historical_validation.json
            data/v13_posterior_policy.json
          retention-days: 90

      - name: Persist backfill evidence and rebuilt predictive artifacts
        run: |
          git config user.name 'MLB Betting Bot V13.10 Historical Transfer'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/v13_historical_backfill.jsonl data/v13_historical_backfill_report.json data/v13_run_mean_prior.json data/v13_distribution_prior.json data/v13_baseball_calibration.json data/v13_historical_validation.json data/v13_posterior_policy.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist V13.10 historical predictive evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
