name: V13 Historical Point-in-Time Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v13-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile V13 backfill
        run: python -m py_compile v11/v13_historical_backfill.py v11/v13_historical_validation.py v11/v13_run_mean_prior.py v11/v13_distribution_prior.py v11/v13_train.py v11/v13_entry.py

      - name: Download durable pregame source replays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/v13/replays
          gh release download v12-data-archive --pattern '*_sources.json.gz' --dir runtime/v13/replays --clobber
          count=$(find runtime/v13/replays -name '*_sources.json.gz' | wc -l)
          echo "Downloaded $count source replays"
          test "$count" -gt 0

      - name: Reconstruct V13 probabilities point-in-time
        run: |
          python -m v11.v13_historical_backfill --dir runtime/v13/replays \
            --output data/v13_historical_backfill.jsonl \
            --report data/v13_historical_backfill_report.json

      - name: Rebuild current-generation FINAL run-mean candidate
        run: python -m v11.v13_run_mean_prior

      - name: Rebuild current-generation FINAL distribution transfer
        run: python -m v11.v13_distribution_prior

      - name: Rebuild baseball calibration from native + exact replay evidence
        run: python -m v11.v13_train

      - name: Build blocked historical predictive validation
        run: python -m v11.v13_historical_validation

      - name: Validate leakage boundary and historical transfer states
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v11 import probability_contract_v13 as contract

          report=json.loads(Path('data/v13_historical_backfill_report.json').read_text())
          assert report['source_replays'] > 0, report
          assert report['replay_pass'] > 0, report
          assert report['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, report
          rows=[]
          p=Path('data/v13_historical_backfill.jsonl')
          for line in p.read_text().splitlines():
              if line.strip(): rows.append(json.loads(line))
          for r in rows:
              assert r['point_in_time'] is True
              assert r['features_from_postgame'] is False
              assert r['market_probability_used_as_baseball_feature'] is False
              assert r['result_status'] == 'SETTLED'
              assert contract.row_is_predictively_compatible(r), r.get('game_pk')
              assert r.get('validation_baseline_model_generation') == contract.MODEL_GENERATION_FINGERPRINT, r.get('game_pk')
              assert r.get('validation_baseline_home_runs') is not None, r.get('game_pk')
              assert r.get('validation_baseline_away_runs') is not None, r.get('game_pk')
              assert r.get('validation_baseline_dispersion') is not None, r.get('game_pk')

          final_games=len({str(r.get('game_pk')) for r in rows if str(r.get('phase') or '').upper() == 'FINAL'})

          prior=json.loads(Path('data/v13_run_mean_prior.json').read_text())
          assert prior['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, prior
          assert int(prior.get('exact_final_games') or 0) <= final_games
          assert (prior.get('safety') or {}).get('independent_pre_candidate_baseline_required') is True
          if prior.get('active'):
              assert prior.get('historical_candidate_active') is True, prior
              assert int(prior.get('exact_final_games') or 0) >= int(prior.get('exact_transfer_required_games') or 20), prior
              assert prior.get('exact_transfer_status') == 'PASS_FINAL_ONLY', prior

          dist=json.loads(Path('data/v13_distribution_prior.json').read_text())
          assert dist['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, dist
          assert dist.get('historical_candidate_active') is True, dist
          assert dist.get('independent_pre_candidate_baseline_required') is True, dist
          assert int(dist.get('exact_final_games') or 0) <= final_games
          if dist.get('active'):
              assert int(dist.get('exact_final_games') or 0) >= int(dist.get('exact_transfer_required_games') or 20), dist
              assert dist.get('exact_transfer_status') == 'PASS_FINAL_ONLY', dist
              assert float((dist.get('current_generation_transfer') or {}).get('nll_gain') or 0) > 0, dist

          calibration=json.loads(Path('data/v13_baseball_calibration.json').read_text())
          assert calibration['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, calibration
          assert calibration.get('training_policy',{}).get('exact_v13_replay_backfill_allowed') is True, calibration

          hist=json.loads(Path('data/v13_historical_validation.json').read_text())
          assert hist['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, hist
          assert hist.get('source') == 'exact archived pregame source replays', hist

          print('V13 backfill rows=',len(rows),'games=',report['canonical_games'],
                'run_mean=',prior.get('exact_final_games'),'/',prior.get('exact_transfer_required_games'),prior.get('exact_transfer_status'),prior.get('active'),
                'distribution=',dist.get('exact_final_games'),'/',dist.get('exact_transfer_required_games'),dist.get('exact_transfer_status'),dist.get('active'),
                'calibration_games=',calibration.get('eligible_games'),
                'historical_validation=',hist.get('canonical_games'))
          PY

      - name: Upload backfill artifact
        uses: actions/upload-artifact@v4
        with:
          name: v13-historical-backfill-${{ github.run_id }}
          path: |
            data/v13_historical_backfill.jsonl
            data/v13_historical_backfill_report.json
            data/v13_run_mean_prior.json
            data/v13_distribution_prior.json
            data/v13_baseball_calibration.json
            data/v13_historical_validation.json
          retention-days: 90

      - name: Persist backfill evidence and rebuilt predictive artifacts
        run: |
          git config user.name 'MLB Betting Bot V13.5.2'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/v13_historical_backfill.jsonl data/v13_historical_backfill_report.json data/v13_run_mean_prior.json data/v13_distribution_prior.json data/v13_baseball_calibration.json data/v13_historical_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist V13.5.2 historical predictive evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
