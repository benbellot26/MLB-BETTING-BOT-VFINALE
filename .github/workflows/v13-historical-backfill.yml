name: V13 Historical Point-in-Time Backfill

on:
  workflow_dispatch:
  schedule:
    # 10:30 UTC during the MLB season: late enough for the previous US slate
    # to be final while keeping the transfer artifact fresh before daytime runs.
    - cron: '30 10 * 3-11 *'

permissions:
  contents: write

concurrency:
  group: v13-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile V13 backfill
        run: python -m py_compile v11/v13_historical_backfill.py v11/v13_run_mean_prior.py v11/v13_entry.py

      - name: Download durable pregame source replays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/v13/replays
          gh release download v12-data-archive --pattern '*_sources.json.gz' --dir runtime/v13/replays --clobber
          count=$(find runtime/v13/replays -name '*_sources.json.gz' | wc -l)
          echo "Downloaded $count source replays"
          test "$count" -gt 0

      - name: Reconstruct V13 probabilities point-in-time
        run: |
          python -m v11.v13_historical_backfill --dir runtime/v13/replays \
            --output data/v13_historical_backfill.jsonl \
            --report data/v13_historical_backfill_report.json

      - name: Rebuild current-generation FINAL run-mean candidate
        run: python -m v11.v13_run_mean_prior

      - name: Validate leakage boundary and run-mean transfer state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v11 import probability_contract_v13 as contract

          report=json.loads(Path('data/v13_historical_backfill_report.json').read_text())
          assert report['source_replays'] > 0, report
          assert report['replay_pass'] > 0, report
          assert report['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, report
          rows=[]
          p=Path('data/v13_historical_backfill.jsonl')
          for line in p.read_text().splitlines():
              if line.strip(): rows.append(json.loads(line))
          for r in rows:
              assert r['point_in_time'] is True
              assert r['features_from_postgame'] is False
              assert r['market_probability_used_as_baseball_feature'] is False
              assert r['result_status'] == 'SETTLED'
              assert contract.row_is_predictively_compatible(r), r.get('game_pk')

          prior=json.loads(Path('data/v13_run_mean_prior.json').read_text())
          assert prior['model_generation'] == contract.MODEL_GENERATION_FINGERPRINT, prior
          assert int(prior.get('exact_final_games') or 0) <= len({str(r.get('game_pk')) for r in rows if str(r.get('phase') or '').upper() == 'FINAL'})
          if prior.get('active'):
              assert prior.get('historical_candidate_active') is True, prior
              assert int(prior.get('exact_final_games') or 0) >= int(prior.get('exact_transfer_required_games') or 20), prior
              assert prior.get('exact_transfer_status') == 'PASS_FINAL_ONLY', prior
          print('V13 backfill rows=',len(rows),'games=',report['canonical_games'],
                'final_transfer=',prior.get('exact_final_games'), '/', prior.get('exact_transfer_required_games'),
                'status=',prior.get('exact_transfer_status'),'active=',prior.get('active'))
          PY

      - name: Upload backfill artifact
        uses: actions/upload-artifact@v4
        with:
          name: v13-historical-backfill-${{ github.run_id }}
          path: |
            data/v13_historical_backfill.jsonl
            data/v13_historical_backfill_report.json
            data/v13_run_mean_prior.json
          retention-days: 90

      - name: Persist backfill evidence and rebuilt run-mean prior
        run: |
          git config user.name 'MLB Betting Bot V13.5.2'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/v13_historical_backfill.jsonl data/v13_historical_backfill_report.json data/v13_run_mean_prior.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist V13.5.2 point-in-time backfill and run-mean transfer [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
