name: V13 History Bridge

on:
  push:
    branches:
      - agent/v13-reconstruct-1801-redo
    paths:
      - 'v11/v13_history_bridge.py'
      - '.github/workflows/v13-history-bridge.yml'
      - 'data/mlb_backtest_2026.jsonl'
      - 'data/v13_historical_backfill.jsonl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bridge validation
        run: python -m v11.v13_history_bridge
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: v13-history-bridge-report
          path: data/v13_history_bridge_report.json
