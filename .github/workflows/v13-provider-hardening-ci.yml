name: V13 Provider Hardening CI

on:
  pull_request:
    paths:
      - 'v11/v137_weather_backfill.py'
      - 'v11/v137_park_factors.py'
      - 'v11/v137_free_data_health.py'
      - 'v11/v138_monitoring.py'
      - 'tests/test_v139_provider_hardening.py'
      - '.github/workflows/v13-provider-hardening-ci.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'v11/v137_weather_backfill.py'
      - 'v11/v137_park_factors.py'
      - 'v11/v137_free_data_health.py'
      - 'v11/v138_monitoring.py'
      - 'tests/test_v139_provider_hardening.py'
      - '.github/workflows/v13-provider-hardening-ci.yml'

permissions:
  contents: read

jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provider modules
        run: python -m py_compile v11/*.py tests/*.py
      - name: Provider regression tests
        run: python -m unittest -v tests.test_v137_free_data tests.test_v139_provider_hardening
      - name: Open-Meteo Previous Runs live smoke
        run: |
          python - <<'PY'
          from v11.v137_weather_backfill import previous_run_weather_for_game
          out=previous_run_weather_for_game(
              '2026-08-18T23:00:00+00:00',
              'New York Yankees',
              '2026-08-18T21:00:00+00:00',
          )
          print(out)
          if not out.get('point_in_time'):
              raise SystemExit('previous-runs fallback lost PIT contract')
          if not out.get('available'):
              raise SystemExit(f"previous-runs provider unavailable: {out.get('reason')}")
          PY
      - name: Park-factor live smoke with fallback allowed
        run: |
          python - <<'PY'
          from v11.v137_park_factors import fetch_prior_factors
          out=fetch_prior_factors(2026, '')
          print('provider=',out.get('provider'),'mode=',out.get('parse_mode'),'venues=',out.get('venue_count'))
          if not out.get('point_in_time') or out.get('promotion_eligible'):
              raise SystemExit('park-factor PIT/promotion contract broken')
          if int(out.get('venue_count') or 0) < 20:
              raise SystemExit('park-factor provider has insufficient venue coverage')
          if 2026 in (out.get('source_window_years') or []):
              raise SystemExit('target-season leakage in park factors')
          PY
