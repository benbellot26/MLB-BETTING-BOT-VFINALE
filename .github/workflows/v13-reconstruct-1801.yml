name: V13 Reconstruct 1801

on:
  push:
    branches: [agent/v13-reconstruct-1801]
    paths:
      - 'v11/v13_reconstruct_1801.py'
      - '.github/workflows/v13-reconstruct-1801.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile v11/v13_reconstruct_1801.py
      - name: Reconstruct and report
        run: python -m v11.v13_reconstruct_1801
      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/v13_final_reconstructed_1801_report.json').read_text())
          assert r['source_games'] == 1801, r
          assert r['reconstructed_games'] == 1801, r
          assert r['warm_games'] >= 1600, r
          assert not r['provenance']['exact_http_replay']
          assert not r['provenance']['historical_market_odds']
          assert not r['provenance']['market_used_in_baseball_probability']
          assert not r['provenance']['totals_calibration_allowed']
          assert r['provenance']['ml_runline_calibration_allowed_on_warm_sample']
          print(json.dumps(r, indent=2))
          PY
