name: Pulsar V14 50-Game Backtest

on:
  pull_request:
    paths:
      - "v14/**"
      - "data/v13_historical_validation.json"
      - "data/v13_historical_backfill.jsonl"
      - "data/v13_feature_store.jsonl"
      - ".github/workflows/v14-backtest-50.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest-50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backtest
        run: python -m py_compile v14/backtest_50.py
      - name: Run exact 50-game audit
        run: python -m v14.backtest_50
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: v14-backtest-50-report
          path: |
            data/v14_backtest_50_report.json
            data/v14_backtest_50_report.md
