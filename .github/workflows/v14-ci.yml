name: Pulsar V14 CI

on:
  push:
    branches: [main]
    paths:
      - "v14/**"
      - "tests/test_v14_*.py"
      - "data/v137/**"
      - "data/v138_dataset_manifest.json"
      - ".github/workflows/v14-ci.yml"
  pull_request:
    paths:
      - "v14/**"
      - "tests/test_v14_*.py"
      - "data/v137/**"
      - "data/v138_dataset_manifest.json"
      - ".github/workflows/v14-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production and research V14
        run: python -m py_compile v14/*.py
      - name: Run V14 production preflight
        run: python -m v14.preflight
      - name: Run complete V14 regression suite
        run: python -m unittest discover -s tests -p 'test_v14_*.py' -v

  historical-pit:
    name: V14.5 strict historical PIT holdout
    needs: v14
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate 2021-2026 PIT dataset and frozen holdouts
        run: |
          set -euo pipefail
          mkdir -p runtime/v14
          python -m v14.historical_validation --output runtime/v14/v14_historical_validation.json
          python -m v14.historical_rich_inventory --output runtime/v14/v14_rich_historical_inventory.json
          python -m v14.historical_rich_validation --output runtime/v14/v14_rich_historical_validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('runtime/v14/v14_historical_validation.json').read_text(encoding='utf-8'))
          inv=json.loads(Path('runtime/v14/v14_rich_historical_inventory.json').read_text(encoding='utf-8'))
          rich=json.loads(Path('runtime/v14/v14_rich_historical_validation.json').read_text(encoding='utf-8'))
          t=x.get('team_run_challenger') or {}
          d=x.get('score_distribution_challenger') or {}
          print('HISTORICAL_STATUS=',x.get('status'))
          print('SPLIT=',json.dumps(x.get('split'),sort_keys=True))
          print('PARAMETERS=',json.dumps(((t.get('tuning') or {}).get('parameters')),sort_keys=True))
          print('RUN_GATE=',json.dumps(t.get('run_gate'),sort_keys=True))
          print('PROBABILITY_2025=',json.dumps(t.get('probability_translation_2025'),sort_keys=True))
          print('PROBABILITY_2026=',json.dumps(t.get('probability_translation_frozen_2026'),sort_keys=True))
          print('DISTRIBUTION=',json.dumps(d,sort_keys=True))
          print('DISTRIBUTION_RUN_MEAN_CONTRACT=',json.dumps(d.get('run_mean_contract'),sort_keys=True))
          print('DISTRIBUTION_SAMPLE_POLICY=',json.dumps(d.get('sample_policy'),sort_keys=True))
          print('DISTRIBUTION_LINE_CONTRACT=',json.dumps(d.get('market_line_contract'),sort_keys=True))
          print('EVIDENCE_TIERS=',json.dumps(x.get('evidence_registry'),sort_keys=True))
          print('RICH_ROWS=',inv.get('rows'))
          print('RICH_TOP_LEVEL_KEYS=',json.dumps(inv.get('top_level_keys'),sort_keys=True))
          print('RICH_EVIDENCE=',json.dumps(rich.get('evidence'),sort_keys=True))
          print('RICH_COVERAGE=',json.dumps(rich.get('coverage'),sort_keys=True))
          print('RICH_V9=',json.dumps((rich.get('historical_models') or {}).get('v9'),sort_keys=True))
          print('RICH_V10=',json.dumps((rich.get('historical_models') or {}).get('v10'),sort_keys=True))
          print('NEXT_STATE=',x.get('recommended_next_state'))
          if (t.get('probability_translation_2025') or {}).get('full_holdout') is not True:
              raise SystemExit('team-run downstream probability proof did not use full 2025 holdout')
          if (t.get('probability_translation_frozen_2026') or {}).get('full_holdout') is not True:
              raise SystemExit('team-run downstream probability proof did not use full frozen 2026 holdout')
          if (d.get('sample_policy') or {}).get('validation_2025_full_holdout') is not True:
              raise SystemExit('distribution validation did not use full 2025 holdout')
          if (d.get('sample_policy') or {}).get('frozen_2026_full_holdout') is not True:
              raise SystemExit('distribution validation did not use full frozen 2026 holdout')
          if (d.get('run_mean_contract') or {}).get('selection_and_primary_validation') != 'STRICT_TEAM_HISTORY_BASELINE':
              raise SystemExit('distribution validation is not isolated from rejected run challenger')
          if (d.get('market_line_contract') or {}).get('total_line') != 8.5:
              raise SystemExit('historical distribution total-line diagnostic contract is not explicit')
          PY
      - name: Archive V14.5 historical evidence
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-v14-historical-validation-${{ github.run_id }}
          path: |
            runtime/v14/v14_historical_validation.json
            runtime/v14/v14_rich_historical_inventory.json
            runtime/v14/v14_rich_historical_validation.json
          retention-days: 90

  savant-pit:
    name: V14.5 live Savant run-value PIT smoke
    needs: v14
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build current PIT defense catcher baserunning shadow artifact
        run: |
          set -euo pipefail
          mkdir -p runtime/v14
          TARGET_DAY=$(date -u +%F)
          export TARGET_DAY
          python -m v14.savant_run_value_builder "$TARGET_DAY" --output runtime/v14/v14_defense_baserunning_priors.json
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          from pathlib import Path
          x=json.loads(Path('runtime/v14/v14_defense_baserunning_priors.json').read_text(encoding='utf-8'))
          c=x.get('coverage') or {}
          print('SAVANT_TARGET=',os.environ['TARGET_DAY'])
          print('SAVANT_COVERAGE=',json.dumps(c,sort_keys=True))
          print('SAVANT_FAILURES=',json.dumps((x.get('failures') or [])[:30]))
          print('FIELDING_COLUMNS=',json.dumps(((x.get('fielding_source') or {}).get('raw_columns') or [])))
          print('BASERUN_COLUMNS=',json.dumps(((x.get('baserunning_source') or {}).get('raw_columns') or [])))
          if int(c.get('complete_teams') or 0) < 20:
              raise SystemExit('insufficient complete Savant team coverage')
          expected=(date.fromisoformat(os.environ['TARGET_DAY'])-timedelta(days=1)).isoformat()
          if x.get('cutoff_day') != expected:
              raise SystemExit(f'Savant PIT cutoff {x.get("cutoff_day")} != target-1 {expected}')
          if x.get('point_in_time') is not True or x.get('champion_impact') is not False:
              raise SystemExit('Savant normalized artifact violated shadow PIT contract')
          PY
      - name: Archive normalized Savant PIT shadow data
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-v14-savant-run-value-${{ github.run_id }}
          path: runtime/v14/v14_defense_baserunning_priors.json
          retention-days: 30

  statcast-pit:
    name: V14.5 live enriched Statcast PIT source smoke
    needs: v14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch a bounded recent Statcast window strictly before cutoff
        run: |
          set -euo pipefail
          mkdir -p runtime/v14
          read TARGET_DAY SOURCE_START <<EOF
          $(python - <<'PY'
          from datetime import datetime, timedelta, timezone
          target=datetime.now(timezone.utc).date()
          print(target.isoformat(), (target-timedelta(days=6)).isoformat())
          PY
          )
          EOF
          export TARGET_DAY SOURCE_START
          python -m v14.statcast_pit_backfill "$TARGET_DAY" --season-start "$SOURCE_START" --output runtime/v14/v14_statcast_pit_smoke.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          x=json.loads(Path('runtime/v14/v14_statcast_pit_smoke.json').read_text(encoding='utf-8'))
          priors=x.get('priors') or {}; coverage=x.get('coverage') or {}
          hitters=priors.get('hitters') or {}; pitchers=priors.get('pitchers') or {}
          print('STATCAST_WINDOW=',x.get('source_start'),x.get('source_end'))
          print('STATCAST_ROWS=',x.get('raw_pitch_rows'),'HITTERS=',len(hitters),'PITCHERS=',len(pitchers))
          print('STATCAST_ENRICHED_COVERAGE=',json.dumps(coverage,sort_keys=True))
          if x.get('point_in_time') is not True or x.get('stable_id_only') is not True or x.get('champion_impact') is not False:
              raise SystemExit('Statcast PIT contract violation')
          if priors.get('schema') != 'pulsar-v14-statcast-id-priors-v2':
              raise SystemExit('Statcast smoke did not build enriched V14 priors')
          if int(x.get('raw_pitch_rows') or 0) <= 0 or not hitters or not pitchers:
              raise SystemExit('Statcast bounded smoke returned no usable PIT data')
          if int(coverage.get('hitter_pitch_split_players') or 0) <= 0 or int(coverage.get('hitter_pitch_split_buckets') or 0) <= 0:
              raise SystemExit('Statcast enriched smoke produced no hitter pitch-type coverage')
          if str(x.get('source_end') or '') >= os.environ['TARGET_DAY']:
              raise SystemExit('Statcast source window crossed target cutoff')
          for bucket in (hitters,pitchers):
              for row in bucket.values():
                  if str(row.get('max_game_date') or '') >= os.environ['TARGET_DAY']:
                      raise SystemExit('Statcast aggregated prior crossed target cutoff')
          PY
      - name: Archive Statcast PIT smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-v14-statcast-pit-${{ github.run_id }}
          path: runtime/v14/v14_statcast_pit_smoke.json
          retention-days: 30

  weather-pit:
    name: V14.5 archived weather PIT smoke
    needs: v14
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct strict pregame weather provenance on recorded historical features
        run: |
          set -euo pipefail
          mkdir -p runtime/v14
          python -m v14.weather_pit_backfill data/v137/team_features_2026.jsonl.gz --limit 5 --output runtime/v14/v14_weather_pit_smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('runtime/v14/v14_weather_pit_smoke.json').read_text(encoding='utf-8'))
          c=x.get('coverage') or {}
          print('WEATHER_COVERAGE=',json.dumps(c,sort_keys=True))
          print('WEATHER_FAILURES=',json.dumps((x.get('failures') or [])[:20],sort_keys=True))
          if x.get('point_in_time') is not True or x.get('champion_impact') is not False:
              raise SystemExit('weather PIT artifact contract violation')
          if int(c.get('pit_rows') or 0) != int(c.get('input_rows') or 0):
              raise SystemExit('some historical weather rows failed PIT provenance validation')
          for row in x.get('rows') or []:
              if row.get('point_in_time') is not True or (row.get('weather') or {}).get('point_in_time') is not True:
                  raise SystemExit('weather row missing strict PIT provenance')
          PY
      - name: Archive weather PIT smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-v14-weather-pit-${{ github.run_id }}
          path: runtime/v14/v14_weather_pit_smoke.json
          retention-days: 30

  identity-scaffold:
    name: V14.5 historical identity scaffold smoke
    needs: v14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve posthoc identities without target-game performance leakage
        run: |
          set -euo pipefail
          mkdir -p runtime/v14
          python -m v14.historical_identity_reconstruction data/v137/team_features_2026.jsonl.gz --limit 5 --output runtime/v14/v14_identity_smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('runtime/v14/v14_identity_smoke.json').read_text(encoding='utf-8'))
          c=x.get('coverage') or {}
          print('IDENTITY_COVERAGE=',json.dumps(c,sort_keys=True))
          print('IDENTITY_FAILURES=',json.dumps((x.get('failures') or [])[:20],sort_keys=True))
          if x.get('promotion_eligible') is not False or x.get('native_live_confirmation_required') is not True:
              raise SystemExit('historical identity scaffold overclaimed promotion eligibility')
          if int(c.get('retrieved') or 0) != 5:
              raise SystemExit('historical identity scaffold could not retrieve all smoke games')
          if int(c.get('ready_diagnostic') or 0) < 4:
              raise SystemExit('historical identity scaffold coverage too low')
          for row in x.get('rows') or []:
              if row.get('identity_mode') != 'POSTHOC_FINAL_BOXSCORE_IDENTITY_ONLY':
                  raise SystemExit('historical identity row did not declare posthoc identity mode')
              if row.get('performance_stats_from_target_game_used') is not False or row.get('promotion_eligible') is not False:
                  raise SystemExit('historical identity scaffold leaked/overclaimed target-game evidence')
          PY
      - name: Archive identity scaffold evidence
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-v14-identity-scaffold-${{ github.run_id }}
          path: runtime/v14/v14_identity_smoke.json
          retention-days: 30
