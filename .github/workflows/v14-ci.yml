name: Pulsar V14 CI

on:
  push:
    branches: [main]
    paths:
      - "v14/**"
      - "tests/test_v14_*.py"
      - ".github/workflows/v14-ci.yml"
  pull_request:
    paths:
      - "v14/**"
      - "tests/test_v14_*.py"
      - ".github/workflows/v14-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production V14
        run: python -m py_compile v14/*.py
      - name: Run V14 production preflight
        run: python -m v14.preflight
      - name: Run complete V14 regression suite
        run: python -m unittest discover -s tests -p 'test_v14_*.py' -v

  historical-pit:
    name: V14.5 strict historical PIT holdout
    needs: v14
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate 2021-2026 PIT dataset and frozen holdouts
        run: |
          mkdir -p runtime/v14
          python -m v14.historical_validation --output runtime/v14/v14_historical_validation.json
          python -m v14.historical_rich_inventory --output runtime/v14/v14_rich_historical_inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('runtime/v14/v14_historical_validation.json').read_text(encoding='utf-8'))
          inv=json.loads(Path('runtime/v14/v14_rich_historical_inventory.json').read_text(encoding='utf-8'))
          t=x.get('team_run_challenger') or {}
          print('HISTORICAL_STATUS=',x.get('status'))
          print('SPLIT=',json.dumps(x.get('split'),sort_keys=True))
          print('PARAMETERS=',json.dumps(((t.get('tuning') or {}).get('parameters')),sort_keys=True))
          print('RUN_GATE=',json.dumps(t.get('run_gate'),sort_keys=True))
          print('PROBABILITY_2025=',json.dumps(t.get('probability_translation_2025'),sort_keys=True))
          print('PROBABILITY_2026=',json.dumps(t.get('probability_translation_frozen_2026'),sort_keys=True))
          print('DISTRIBUTION=',json.dumps(x.get('score_distribution_challenger'),sort_keys=True))
          print('EVIDENCE_TIERS=',json.dumps(x.get('evidence_registry'),sort_keys=True))
          print('RICH_TOP_LEVEL_KEYS=',json.dumps(inv.get('top_level_keys'),sort_keys=True))
          print('RICH_INTERESTING_PATHS=',json.dumps((inv.get('interesting_paths') or [])[:120],sort_keys=True))
          print('NEXT_STATE=',x.get('recommended_next_state'))
          PY
      - name: Archive V14.5 historical validation
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-v14-historical-validation-${{ github.run_id }}
          path: |
            runtime/v14/v14_historical_validation.json
            runtime/v14/v14_rich_historical_inventory.json
          retention-days: 90
