name: Pulsar V14 CI

on:
  push:
    branches: [main]
    paths:
      - "v14/**"
      - "tests/test_v14_*.py"
      - ".github/workflows/v14-ci.yml"
  pull_request:
    paths:
      - "v14/**"
      - "tests/test_v14_*.py"
      - ".github/workflows/v14-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production V14
        run: python -m py_compile v14/*.py
      - name: Run V14 production guards
        run: |
          python -m unittest \
            tests.test_v14_context_overlay \
            tests.test_v14_feature_row \
            tests.test_v14_market_edge \
            tests.test_v14_run_stack_parity \
            tests.test_v14_structural_parity \
            tests.test_v14_v13_context_adapter
