name: Pulsar V14 Close Capture

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  capture:
    name: Capture prospective verified closes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate close-capture modules
        run: |
          python -m py_compile v14/market_close_ledger.py v14/paper_ledger.py v14/official_close.py v14/sharp_market.py

      - name: Capture tracked market, paper and official closes
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m v14.market_close_ledger capture \
            --ledger data/v14_market_close_ledger.jsonl \
            --report data/v14_market_close_report.json
          python -m v14.paper_ledger capture-close --ledger data/v14_paper_bet_ledger.jsonl
          python -m v14.market_close_ledger hydrate-paper \
            --ledger data/v14_market_close_ledger.jsonl \
            --paper-ledger data/v14_paper_bet_ledger.jsonl
          python -m v14.official_close --ledger data/v14_bet_ledger.jsonl

      - name: Persist prospective close evidence
        run: |
          git config user.name 'Pulsar V14'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v14_market_close_ledger.jsonl ] && git add -f data/v14_market_close_ledger.jsonl
          [ -f data/v14_market_close_report.json ] && git add -f data/v14_market_close_report.json
          [ -f data/v14_paper_bet_ledger.jsonl ] && git add -f data/v14_paper_bet_ledger.jsonl
          [ -f data/v14_bet_ledger.jsonl ] && git add -f data/v14_bet_ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'data: capture V14 prospective closes [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
