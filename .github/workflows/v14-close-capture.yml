name: Pulsar V14 Close Capture

on:
  schedule:
    # Frequent wake-up is cheap: the local due-check performs zero paid API calls.
    # At most one Odds snapshot is fetched in a run, only when a first certified
    # close is actually due, and that snapshot is shared by all three ledgers.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  capture:
    name: Cost-aware prospective verified closes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate cost-aware close modules
        run: |
          python -m py_compile \
            v14/market_close_bootstrap.py \
            v14/market_close_ledger.py \
            v14/paper_ledger.py \
            v14/official_close.py \
            v14/sharp_market.py \
            v14/api_budget.py \
            v14/cost_aware_close_capture.py

      - name: Bootstrap tracked games from persisted predictions
        run: |
          python -m v14.market_close_bootstrap \
            --predictions data/v14_predictions.jsonl \
            --ledger data/v14_market_close_ledger.jsonl

      - name: Capture closes with one shared paid snapshot only when due
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Override in repository/environment variables only if deliberately desired.
          V14_MAX_PAID_CLOSE_SNAPSHOTS_PER_DAY: '12'
        run: |
          python -m v14.cost_aware_close_capture \
            --market-ledger data/v14_market_close_ledger.jsonl \
            --paper-ledger data/v14_paper_bet_ledger.jsonl \
            --bet-ledger data/v14_bet_ledger.jsonl \
            --api-usage-ledger data/v14_api_usage.jsonl
          # Hydration/reporting below is purely local.
          python -m v14.market_close_ledger hydrate-paper \
            --ledger data/v14_market_close_ledger.jsonl \
            --paper-ledger data/v14_paper_bet_ledger.jsonl
          python -m v14.market_close_ledger report \
            --ledger data/v14_market_close_ledger.jsonl \
            --output data/v14_market_close_report.json
          python -m v14.api_budget report \
            --ledger data/v14_api_usage.jsonl \
            --output data/v14_api_usage_report.json

      - name: Persist prospective close evidence and paid-request accounting
        run: |
          git config user.name 'Pulsar V14'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v14_market_close_ledger.jsonl ] && git add -f data/v14_market_close_ledger.jsonl
          [ -f data/v14_market_close_report.json ] && git add -f data/v14_market_close_report.json
          [ -f data/v14_paper_bet_ledger.jsonl ] && git add -f data/v14_paper_bet_ledger.jsonl
          [ -f data/v14_bet_ledger.jsonl ] && git add -f data/v14_bet_ledger.jsonl
          [ -f data/v14_api_usage.jsonl ] && git add -f data/v14_api_usage.jsonl
          [ -f data/v14_api_usage_report.json ] && git add -f data/v14_api_usage_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: capture cost-aware V14 prospective closes [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
