name: V14 Native Run Model Shadow

on:
  schedule:
    # Runs after the daily V13 historical/state refresh. It reads only committed
    # PIT feature/label stores and never calls an external data API.
    - cron: '45 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  train-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: V14 critical preflight
        run: |
          python -m py_compile v14/*.py tests/test_v14_*.py
          python -m v14.preflight

      - name: Build native V14 run-model artifact
        run: |
          python -m v14.run_model \
            --features data/v13_feature_store.jsonl \
            --labels data/v13_label_store.jsonl \
            --output data/v14_run_model.json

      - name: Assert run model remains shadow-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path('data/v14_run_model.json').read_text(encoding='utf-8'))
          if artifact.get('role') != 'V14_NATIVE_RUN_MODEL_SHADOW_ONLY':
              raise SystemExit('unexpected V14 run-model role')
          if artifact.get('affects_production') is not False:
              raise SystemExit('V14 run model must never affect production directly')
          if artifact.get('market_probability_used') is not False:
              raise SystemExit('market probability leaked into V14 run model')
          if artifact.get('active_for_shadow') is True and artifact.get('activation_gate_passes') is not True:
              raise SystemExit('V14 run model active without its statistical gate')
          print('V14 native run model remains isolated and evidence-gated')
          PY

      - name: Persist V14 run-model evidence only
        run: |
          git config user.name 'MLB Betting Bot V14 Shadow'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/v14_run_model.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update V14 native run-model evidence [skip ci]'
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
