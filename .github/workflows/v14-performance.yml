name: Pulsar V14 Performance

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate V14 production and statistical hardening
        run: |
          python -m py_compile v14/*.py
          python -m v14.preflight
      - name: Settle finished predictions and ledgers
        run: |
          python -m v14.tracking settle \
            --predictions data/v14_predictions.jsonl \
            --report data/v14_performance.json
          python -m v14.paper_ledger settle \
            --ledger data/v14_paper_bet_ledger.jsonl \
            --report data/v14_paper_bet_performance.json
          python -m v14.bet_ledger settle \
            --ledger data/v14_bet_ledger.jsonl \
            --report data/v14_bet_performance.json
      - name: Fit fail-closed probability calibration and uncertainty
        run: |
          python -m v14.probability_calibration fit \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_calibration.json
          python -m v14.uncertainty_fit \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_uncertainty.json
      - name: Rebuild performance and certification with current evidence
        run: |
          python -m v14.tracking report \
            --predictions data/v14_predictions.jsonl \
            --report data/v14_performance.json
      - name: Evaluate all shadow challengers
        run: |
          python -m v14.distribution_tuning \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_distribution_candidate.json
          python -m v14.historical_distribution_live_validation \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_distribution_live_validation.json
          python -m v14.residual_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_residual_challenger.json
          python -m v14.market_posterior_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_market_posterior_candidate.json
          python -m v14.calibration_methods_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_calibration_methods_candidate.json
          python -m v14.heteroskedastic_distribution_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_heteroskedastic_candidate.json
          python -m v14.sharp_weight_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_sharp_book_weights_candidate.json
      - name: Persist V14 settled performance and research artifacts
        run: |
          git config user.name 'Pulsar V14'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for file in \
            data/v14_predictions.jsonl \
            data/v14_performance.json \
            data/v14_calibration.json \
            data/v14_uncertainty.json \
            data/v14_distribution_candidate.json \
            data/v14_distribution_live_validation.json \
            data/v14_residual_challenger.json \
            data/v14_market_posterior_candidate.json \
            data/v14_calibration_methods_candidate.json \
            data/v14_heteroskedastic_candidate.json \
            data/v14_sharp_book_weights_candidate.json \
            data/v14_paper_bet_ledger.jsonl \
            data/v14_paper_bet_performance.json \
            data/v14_bet_ledger.jsonl \
            data/v14_bet_performance.json; do
            [ -f "$file" ] && git add -f "$file"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: settle V14 performance, ledgers and challengers [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
