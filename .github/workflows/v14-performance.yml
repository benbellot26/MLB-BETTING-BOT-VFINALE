name: Pulsar V14 Performance

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Hydrate mutable evidence from runtime-data
        run: |
          python -m v14.state_branch hydrate --manifest research/v14_runtime_operational_paths.txt
          python -m v14.state_branch hydrate --manifest research/v14_runtime_performance_paths.txt
          python -m v14.state_branch hydrate --manifest research/v14_runtime_reference_paths.txt

      - name: Validate V14 production and seal research protocol
        run: |
          python -m py_compile v14/*.py
          python -m v14.preflight
          python -m v14.reproducibility_guard --fail-on-external
          python -m v14.research_registry bootstrap \
            --specs research/v14_experiments.json \
            --registry data/v14_experiment_registry.jsonl \
            --commit-sha "$GITHUB_SHA"
          python -m v14.research_registry bootstrap \
            --specs research/v14_professionalization_experiments.json \
            --registry data/v14_experiment_registry.jsonl \
            --commit-sha "$GITHUB_SHA"
          python -m v14.research_registry verify --registry data/v14_experiment_registry.jsonl

      - name: Settle finished predictions and ledgers
        run: |
          python -m v14.tracking settle \
            --predictions data/v14_predictions.jsonl \
            --report data/v14_performance.json
          python -m v14.paper_ledger settle \
            --ledger data/v14_paper_bet_ledger.jsonl \
            --report data/v14_paper_bet_performance.json
          python -m v14.bet_ledger settle \
            --ledger data/v14_bet_ledger.jsonl \
            --report data/v14_bet_performance.json

      - name: Fit fail-closed probability calibration and current safety uncertainty
        run: |
          python -m v14.probability_calibration fit \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_calibration.json
          python -m v14.uncertainty_fit \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_uncertainty.json

      - name: Build zero-API canonical and primary-sharp evidence
        run: |
          python -m v14.snapshot_policy \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_snapshot_policy_report.json
          python -m v14.sharp_benchmark \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_sharp_benchmark_report.json
          python -m v14.prospective_cohort \
            --predictions data/v14_predictions.jsonl \
            --registry data/v14_experiment_registry.jsonl \
            --output data/v14_prospective_cohorts.json
          python -m v14.coverage_ledger report \
            --ledger data/v14_coverage_ledger.jsonl \
            --output data/v14_coverage_report.json

      - name: Rebuild performance with current evidence
        run: |
          python -m v14.tracking report \
            --predictions data/v14_predictions.jsonl \
            --report data/v14_performance.json
          python - <<'PY'
          import json
          from pathlib import Path
          from v14.certification import load_status
          status=load_status()
          Path('data/v14_betting_certification.json').write_text(json.dumps(status,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('PULSAR_V14_STRICT_CERTIFICATION',json.dumps({'probability_status':status.get('probability_status'),'betting_status':status.get('betting_status'),'primary_sharp':(status.get('policy') or {}).get('primary_sharp_benchmark')},sort_keys=True))
          PY

      - name: Evaluate all shadow challengers
        run: |
          python -m v14.distribution_tuning \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_distribution_candidate.json
          python -m v14.historical_team_live_validation \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_team_run_live_validation.json
          python -m v14.historical_distribution_live_validation \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_distribution_live_validation.json
          python -m v14.residual_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_residual_challenger.json
          python -m v14.residual_weight_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_residual_weight_candidate.json
          python -m v14.opener_bulk_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_opener_bulk_candidate.json
          python -m v14.market_posterior_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_market_posterior_candidate.json
          python -m v14.calibration_methods_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_calibration_methods_candidate.json
          python -m v14.heteroskedastic_distribution_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_heteroskedastic_candidate.json
          python -m v14.sharp_weight_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_sharp_book_weights_candidate.json
          python -m v14.bootstrap_uncertainty_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_bootstrap_uncertainty_candidate.json
          python -m v14.learned_run_mean_challenger \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_learned_run_mean_candidate.json

      - name: Build paired baselines, regimes and preregistered ablations
        run: |
          python -m v14.research_diagnostics \
            --predictions data/v14_predictions.jsonl \
            --output data/v14_research_diagnostics.json
          python -m v14.ablation_report \
            --predictions data/v14_predictions.jsonl \
            --registry data/v14_experiment_registry.jsonl \
            --output data/v14_ablation_report.json

      - name: Fail closed on non-preregistered promotion claims
        run: |
          python -m v14.promotion_guard \
            --registry data/v14_experiment_registry.jsonl \
            --output data/v14_promotion_guard.json \
            --fail-on-unsafe

      - name: Build zero-API data quality dashboard
        run: |
          python -m v14.data_quality_dashboard --output data/v14_data_quality_dashboard.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/v14_data_quality_dashboard.json').read_text(encoding='utf-8'))
          print('PULSAR_V14_DATA_QUALITY',json.dumps({'operational_status':x.get('operational_status'),'betting_status':x.get('betting_status'),'scheduled_final_unique_games':x.get('current_generation_scheduled_final_unique_games'),'warnings':x.get('warnings'),'critical':x.get('critical')},sort_keys=True))
          PY

      - name: Build longitudinal read-only champion dashboard
        run: |
          python -m v14.champion_dashboard \
            --json data/v14_champion_dashboard.json \
            --markdown data/v14_champion_dashboard.md \
            --history data/v14_champion_dashboard_history.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/v14_champion_dashboard.json').read_text(encoding='utf-8'))
          status=x.get('authoritative_status') or {}
          print('PULSAR_V14_CHAMPION_DASHBOARD',json.dumps({
              'betting_status':status.get('betting_status'),
              'certified':status.get('certified'),
              'independent_games':(x.get('sample_maturity') or {}).get('independent_games'),
          },sort_keys=True))
          PY

      - name: Persist settled state and research artifacts on runtime-data
        run: |
          python -m v14.state_branch persist \
            --manifest research/v14_runtime_operational_paths.txt \
            --message 'data: settle V14 operational ledgers [skip ci]'
          python -m v14.state_branch persist \
            --manifest research/v14_runtime_performance_paths.txt \
            --message 'data: settle V14 performance and preregistered research evidence [skip ci]'

      - name: Send simple daily Discord recap
        if: github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m v14.daily_summary \
            --predictions data/v14_predictions.jsonl \
            --performance data/v14_performance.json \
            --certification data/v14_betting_certification.json