name: V14 Clean Shadow CI

on:
  pull_request:
    paths:
      - 'v14/**'
      - 'tests/test_v14_*.py'
      - '.github/workflows/v14-shadow-ci.yml'
  push:
    branches: [main]
    paths:
      - 'v14/**'
      - 'tests/test_v14_*.py'
      - '.github/workflows/v14-shadow-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v14-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V14 only
        run: python -m py_compile v14/*.py tests/test_v14_*.py
      - name: V14 critical preflight
        run: python -m v14.preflight --verbose
      - name: Assert shadow isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden_imports=('from v11','import v11')
          for path in Path('v14').glob('*.py'):
              text=path.read_text(encoding='utf-8')
              if any(token in text for token in forbidden_imports):
                  raise SystemExit(f'V14 runtime imports legacy stack: {path}')
          shadow=Path('v14/shadow.py').read_text(encoding='utf-8')
          for token in ('official_selected','official_units','DISCORD_WEBHOOK_URL'):
              if token in shadow:
                  raise SystemExit(f'V14 shadow contains actionable production token: {token}')
          print('V14 isolation OK')
          PY
