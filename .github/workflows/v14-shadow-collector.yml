name: V14 Paired Shadow Collector

on:
  schedule:
    # Runs after the V13 production cadence. Shared concurrency means this waits
    # for any V13 state writer, then checks out the newest committed state.
    - cron: '25 0-6,14-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: V14 clean preflight
        run: |
          python -m py_compile v14/*.py tests/test_v14_*.py
          python -m v14.preflight

      - name: Build V14 shadows from committed V13 pregame journal
        run: |
          python -m v14.shadow --journal data/v11_3_live.jsonl --output data/v14_shadow_predictions.jsonl

      - name: Join only separately settled FINAL labels and score paired evidence
        run: |
          python -m v14.evidence \
            --shadow data/v14_shadow_predictions.jsonl \
            --labels data/v13_label_store.jsonl \
            --output data/v14_paired_evidence.json

      - name: Assert V14 remains non-actionable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/v14_paired_evidence.json')
          if not p.exists():
              raise SystemExit('V14 paired evidence artifact missing')
          report=json.loads(p.read_text(encoding='utf-8'))
          if report.get('promotion_allowed') is not False:
              raise SystemExit('V14 foundation unexpectedly became promotable')
          if 'INDEPENDENT_V14_RUN_MODEL_NOT_IMPLEMENTED' not in (report.get('promotion_blockers') or []):
              raise SystemExit('V14 independent run-model blocker missing')
          print('V14 paired shadow remains isolated and non-actionable')
          PY

      - name: Persist V14 shadow evidence only
        run: |
          git config user.name 'MLB Betting Bot V14 Shadow'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          [ -f data/v14_shadow_predictions.jsonl ] && git add -f data/v14_shadow_predictions.jsonl
          [ -f data/v14_paired_evidence.json ] && git add -f data/v14_paired_evidence.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update V14 paired shadow evidence [skip ci]'
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
