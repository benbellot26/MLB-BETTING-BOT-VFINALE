name: Pulsar V14 Enriched Statcast

on:
  push:
    branches: [main]
    paths:
      - 'v14/statcast_daily.py'
      - 'v14/statcast_pit_backfill.py'
      - 'v14/statcast_enrichment.py'
      - 'v14/statcast_shadow.py'
      - 'v14/statcast_multiwindow_challenger.py'
      - 'tests/test_v14_statcast_*.py'
      - '.github/workflows/v14-statcast-refresh.yml'
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-betting-bot-state
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Hydrate refreshed reference state from runtime-data
        run: python -m v14.state_branch hydrate --manifest research/v14_runtime_reference_paths.txt

      - name: Compile and test V14 Statcast contract
        run: |
          python -m py_compile v14/statcast_enrichment.py v14/statcast_pit_backfill.py v14/statcast_daily.py v14/statcast_shadow.py v14/statcast_multiwindow_challenger.py v14/pitch_matchup_challenger.py
          python -m unittest tests.test_v14_statcast_pit_backfill tests.test_v14_statcast_enrichment tests.test_v14_statcast_daily tests.test_v14_statcast_multiwindow_challenger -v

      - name: Refresh enriched rolling 45-day production priors
        run: |
          CUTOFF=$(date -u +%F)
          python -m v14.statcast_daily --cutoff "$CUTOFF" --lookback-days 45
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          p=Path('data/v14_statcast_priors_latest.json.gz')
          with gzip.open(p,'rt',encoding='utf-8') as fh:x=json.load(fh)
          d=x.get('diagnostics') or {}
          print('V14_STATCAST_SCHEMA=',x.get('schema'))
          print('V14_STATCAST_CUTOFF=',x.get('cutoff_day'))
          print('V14_STATCAST_HITTERS=',len(x.get('hitters') or {}))
          print('V14_STATCAST_PITCHERS=',len(x.get('pitchers') or {}))
          print('V14_STATCAST_SPLIT_PLAYERS=',d.get('hitter_pitch_split_players'))
          print('V14_STATCAST_SPLIT_BUCKETS=',d.get('hitter_pitch_split_buckets'))
          if x.get('schema')!='pulsar-v14-statcast-id-priors-v2':raise SystemExit('unexpected enriched Statcast schema')
          if x.get('point_in_time') is not True or x.get('stable_id_only') is not True:raise SystemExit('Statcast artifact lost PIT/stable-ID contract')
          if int(d.get('hitter_pitch_split_players') or 0)<=0 or int(d.get('hitter_pitch_split_buckets') or 0)<=0:raise SystemExit('pitch-type hitter splits absent')
          PY

      - name: Refresh adaptive multi-window shadow twice weekly or on code/manual run
        run: |
          set -euo pipefail
          DOW=$(date -u +%u)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DOW" != "2" ] && [ "$DOW" != "5" ]; then
            echo 'PULSAR_V14_MULTIWINDOW_NOOP scheduled refresh limited to Tue/Fri; existing shadow artifacts retained'
            exit 0
          fi
          CUTOFF=$(date -u +%F)
          python -m v14.statcast_daily --cutoff "$CUTOFF" --lookback-days 14 --priors data/v14_statcast_priors_14d_shadow.json.gz --report runtime/v14-statcast-14d-report.json
          python -m v14.statcast_daily --cutoff "$CUTOFF" --lookback-days 30 --priors data/v14_statcast_priors_30d_shadow.json.gz --report runtime/v14-statcast-30d-report.json
          python -m v14.statcast_daily --cutoff "$CUTOFF" --lookback-days 60 --priors data/v14_statcast_priors_60d_shadow.json.gz --report runtime/v14-statcast-60d-report.json
          python -m v14.statcast_multiwindow_challenger \
            --window14 data/v14_statcast_priors_14d_shadow.json.gz \
            --window30 data/v14_statcast_priors_30d_shadow.json.gz \
            --window45 data/v14_statcast_priors_latest.json.gz \
            --window60 data/v14_statcast_priors_60d_shadow.json.gz \
            --output data/v14_statcast_multiwindow_shadow.json

      - name: Persist Statcast production and shadow state on runtime-data
        run: |
          python -m v14.state_branch persist \
            --manifest research/v14_runtime_reference_paths.txt \
            --message 'data: refresh V14 Statcast production and multi-window shadow [skip ci]'

      - name: Archive refresh evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulsar-v14-enriched-statcast-${{ github.run_id }}
          path: |
            data/v14_statcast_priors_latest.json.gz
            data/v14_statcast_priors_report.json
            data/v14_statcast_priors_14d_shadow.json.gz
            data/v14_statcast_priors_30d_shadow.json.gz
            data/v14_statcast_priors_60d_shadow.json.gz
            data/v14_statcast_multiwindow_shadow.json
          if-no-files-found: ignore
          retention-days: 30
